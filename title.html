<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>头衔申请 · 达一中校园墙</title>
    <style>
        :root { --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --muted:#aaa; --accent:#ff7675; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 18px; }
        .wrap { max-width:520px; margin:0 auto; }
        .back { color:var(--muted); text-decoration:none; font-size:14px; }
        h1 { color:var(--accent); font-size:22px; margin:16px 0 6px; }
        .sub { color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.7; }
        .card { background:var(--panel); border:1px solid #2a2a2a; border-radius:12px; padding:18px; margin-bottom:16px; }
        .chips { display:flex; flex-direction:column; gap:10px; }
        .chip { text-align:left; padding:14px; border-radius:10px; border:1px solid #333; background:#181818; color:var(--text); font-size:14px; cursor:pointer; line-height:1.6; }
        .chip.active { border-color:var(--accent); background:rgba(255,118,117,.08); }
        .chip small { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
        label { display:block; font-size:13px; color:var(--muted); margin:16px 0 6px; }
        input { width:100%; padding:11px; border-radius:8px; border:1px solid #333; background:#161616; color:var(--text); font-size:14px; outline:none; }
        input:focus { border-color:var(--accent); }
        .upload { display:flex; align-items:center; gap:12px; margin-top:8px; }
        .up-btn { padding:10px 16px; border-radius:8px; border:1px dashed #444; color:var(--text); font-size:14px; cursor:pointer; display:inline-block; }
        #preview { width:90px; height:90px; object-fit:cover; border-radius:8px; border:1px solid #333; display:none; }
        .btn { width:100%; margin-top:18px; padding:13px; border:none; border-radius:8px; background:var(--accent); color:#121212; font-weight:bold; font-size:15px; cursor:pointer; }
        .msg { margin-top:12px; font-size:13px; line-height:1.6; display:none; }
        .msg.ok { display:block; color:#55efc4; }
        .msg.err { display:block; color:#ff6b6b; }
        .hint { font-size:12px; color:#777; line-height:1.7; margin-top:12px; }
        .grad { background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:bold; }
        .text-gold { background-image:linear-gradient(90deg,#f9ca24,#f6e58d,#f9ca24); }
        .text-diamond { background-image:linear-gradient(90deg,#74b9ff,#e0f7fa,#a29bfe,#74b9ff); }
        .text-rainbow { background-image:linear-gradient(90deg,#ff7675,#fdcb6e,#55efc4,#74b9ff,#a29bfe,#ff7675); }
    
        /* 全站动态背景 */
        .bg-media { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-media video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .bg-media .bg-mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,18,18,0.45) 0%, rgba(18,18,18,0.88) 100%); }
        .wrap, .container, .card, .pf-card, .modal-content { position: relative; z-index: 1; }
    </style>
<link rel="icon" href="./images/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="校园墙">
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js?v=2').then(function (r) { r.update(); }).catch(function () {}); });</script>
</head>
<body>
<div class="bg-media" aria-hidden="true"><video autoplay muted loop playsinline preload="none"></video><div class="bg-mask"></div></div>
<script>
(function () {
  var v = document.querySelector('.bg-media video');
  var wide = window.matchMedia('(min-width: 1100px)').matches;
  v.src = wide
    ? './images/bg-1080.mp4'
    : './images/bg-720.mp4';
  v.play().catch(function () {});
})();
</script>

<div class="wrap">
    <a class="back" href="./index.html">← 返回首页</a>
    <h1>✨ 头衔申请</h1>
    <p class="sub">在首页赞助页付款后，把付款截图传上来，选好档位提交。站长确认后头衔会用在你发帖的昵称后面。每人最多拥有三个头衔。</p>

    <div class="card">
        <div class="chips">
            <button class="chip active" data-title="🍍StarsPro" data-amount="任意金额" onclick="pick(this)">
                🍍 <b class="grad text-gold">🍍StarsPro</b>
                <small>赞赏任意金额就能申请</small>
            </button>
            <button class="chip" data-title="🍍Stars++" data-amount="5元" onclick="pick(this)">
                💎 <b class="grad text-diamond">🍍Stars++</b>
                <small>赞赏 5 元及以上</small>
            </button>
            <button class="chip" data-title="自定义" data-amount="10元" onclick="pick(this)">
                🌈 <b class="grad text-rainbow">自定义七彩称号</b>
                <small>赞赏 10 元及以上，自己起名，最多 10 个字</small>
            </button>
        </div>

        <div id="custom-wrap" hidden>
            <label>你想要的称号文字（最多 10 个字）</label>
            <input id="custom-title" maxlength="10" placeholder="比如：达一中最懂电脑之人">
        </div>

        <label>赞赏金额</label>
        <input id="amount" placeholder="比如 5 元，写数字就行">

        <label>付款截图（必传）</label>
        <div class="upload">
            <label class="up-btn" for="proof-file">＋ 上传截图</label>
            <input type="file" id="proof-file" accept="image/*" onchange="pickProof(event)" style="display:none">
            <img id="preview" alt="付款截图预览">
        </div>

        <button class="btn" onclick="submitTitle()">提交申请</button>
        <div class="msg" id="msg"></div>
        <p class="hint">每次提交都要带付款记录。审核不过会作废，别反复提交同一笔。</p>
    </div>
</div>

<script>
    const API = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api';
    const token = localStorage.getItem('wall_token');
    if (!token) location.replace('./account.html');

    let picked = { title: '🍍StarsPro', amount: '任意金额' };
    let proofData = '';

    function api(action, data) {
        return fetch(API + '?action=' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ token }, data || {}))
        }).then(r => r.json()).catch(() => ({ code: -1, message: '网络请求失败' }));
    }

    function pick(el) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        picked = { title: el.dataset.title, amount: el.dataset.amount };
        document.getElementById('custom-wrap').hidden = el.dataset.title !== '自定义';
        document.getElementById('amount').placeholder = '默认 ' + el.dataset.amount;
    }

    function compressImage(file, maxSize, quality) {
        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', 0.75));
            };
            img.src = url;
        });
    }

    async function pickProof(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        proofData = await compressImage(file, 900, 0.75);
        const img = document.getElementById('preview');
        img.src = proofData;
        img.style.display = 'block';
    }

    async function submitTitle() {
        const msg = document.getElementById('msg');
        const custom = document.getElementById('custom-title').value.trim();
        const title = picked.title === '自定义' ? custom : picked.title;
        const amount = document.getElementById('amount').value.trim() || picked.amount;

        if (!title) {
            msg.textContent = '自定义称号不能空';
            msg.className = 'msg err';
            return;
        }
        if (!proofData) {
            msg.textContent = '先把付款截图传上来';
            msg.className = 'msg err';
            return;
        }

        const res = await api('titleRequest', { title, amount, proof: proofData });
        if (res.code === 200) {
            msg.textContent = res.message;
            msg.className = 'msg ok';
            proofData = '';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('proof-file').value = '';
        } else if (res.code === 401) {
            location.replace('./account.html');
        } else {
            msg.textContent = res.message || '提交失败';
            msg.className = 'msg err';
        }
    }
</script>
</body>
</html>
