<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投稿 · 达一中校园墙</title>
    <style>
        :root { --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --muted:#aaa; --accent:#ff7675; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 18px; }
        .wrap { max-width:520px; margin:0 auto; }
        .back { color:var(--muted); text-decoration:none; font-size:14px; }
        h1 { color:var(--accent); font-size:22px; margin:16px 0 6px; }
        .sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
        .card { background:var(--panel); border:1px solid #2a2a2a; border-radius:12px; padding:18px; margin-bottom:16px; }
        .q { font-size:14px; font-weight:bold; margin:18px 0 6px; }
        .q:first-child { margin-top:0; }
        .q small { font-weight:normal; color:#777; margin-left:4px; font-size:12px; }
        .tip { font-size:12px; color:#777; line-height:1.7; margin:0 0 8px; }
        input, textarea, select { width:100%; padding:11px; border-radius:8px; border:1px solid #333; background:#161616; color:var(--text); font-size:14px; font-family:inherit; outline:none; }
        textarea { min-height:150px; resize:vertical; line-height:1.7; }
        input:focus, textarea:focus, select:focus { border-color:var(--accent); }
        .btn { width:100%; margin-top:18px; padding:13px; border:none; border-radius:8px; background:var(--accent); color:#121212; font-weight:bold; font-size:15px; cursor:pointer; }
        .msg { margin-top:12px; font-size:13px; line-height:1.6; display:none; }
        .msg.ok { display:block; color:#55efc4; }
        .msg.err { display:block; color:#ff6b6b; }
        .mine { border:1px solid #2a2a2a; border-radius:10px; padding:12px; margin-bottom:10px; background:#181818; }
        .mine .meta { font-size:12px; color:var(--muted); margin-bottom:6px; }
        .mine .txt { font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
        .st { display:inline-block; padding:1px 8px; border-radius:4px; font-size:12px; margin-left:6px; }
        .st.pending { background:rgba(253,203,110,.15); color:#fdcb6e; }
        .st.approved { background:rgba(85,239,196,.15); color:#55efc4; }
        .st.rejected { background:rgba(255,107,107,.15); color:#ff6b6b; }
        .empty { color:var(--muted); font-size:13px; }
        .tag { display:inline-block; padding:1px 8px; border-radius:4px; background:rgba(255,118,117,.15); color:var(--accent); font-size:12px; margin-right:6px; }
        .anon-row { display:flex; align-items:center; gap:8px; margin:14px 0 4px; font-size:14px; color:var(--text); cursor:pointer; }
        .anon-row input { width:auto; }
        .upload-row { margin:8px 0; }
        .up-btn { display:inline-block; padding:10px 16px; border-radius:8px; border:1px dashed #444; color:var(--text); font-size:14px; cursor:pointer; }
        .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
        .thumb { position:relative; width:76px; height:76px; }
        .thumb img { width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid #333; }
        .thumb span { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:#ff6b6b; color:#fff; font-size:12px; line-height:20px; text-align:center; cursor:pointer; }
    
        /* 全站动态背景 */
        .bg-media { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-media video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .bg-media .bg-mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,18,18,0.45) 0%, rgba(18,18,18,0.88) 100%); }
        .wrap, .container, .card, .pf-card, .modal-content { position: relative; z-index: 1; }
    </style>
</head>
<body>
<div class="bg-media" aria-hidden="true"><video autoplay muted loop playsinline preload="none"></video><div class="bg-mask"></div></div>
<script>
(function () {
  var v = document.querySelector('.bg-media video');
  var wide = window.matchMedia('(min-width: 1100px)').matches;
  v.src = wide
    ? 'https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bg-1080.mp4'
    : 'https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bg-720.mp4';
  v.play().catch(function () {});
})();
</script>

<div class="wrap">
    <a class="back" href="./app.html">← 返回校园墙</a>
    <h1>达一中校园墙の投稿入口</h1>
    <p class="sub">内容需经过站长人工审核，通过后才会出现。</p>

    <div class="card">

        <label class="anon-row">
            <input type="checkbox" id="anonymous" onchange="onAnonChange()">
            <span>匿名发布（不显示昵称和班级；不勾就会带上你资料里的班级）</span>
        </label>

        <div class="q">01 请选择您想发布的主题</div>
        <select id="category">
            <option value="寻物启事">寻物启事</option>
            <option value="日常分享">日常分享</option>
            <option value="交友广场">交友dd</option>
            <option value="表白专区">表白墙</option>
            <option value="意见反馈">意见反馈</option>
            <option value="挂人避雷">⚠️ 挂人避雷</option>
            <option value="约稿专区">🎨 约稿专区</option>
            <option value="二手市场">🛒 二手市场</option>
        </select>

        <div class="q">02 标题</div>
        <input id="title" placeholder="一句话说清楚这条帖子讲什么">

        <div class="q">03 请输入您要发布的主题的正文</div>
        <p class="tip">需要加粗：&lt;加粗&gt;这段内容需要加粗&lt;/加粗&gt;</p>
        <textarea id="content" placeholder="请输入"></textarea>

        <div class="q">04 携带图片 <small>可选，最多 6 张</small></div>
        <p class="tip">
            点下面按钮从相册选，会自动压缩。<br>
            正文里写 &lt;p1&gt; 就会在那个位置显示图片。
        </p>
        <div class="upload-row">
            <label class="up-btn" for="img-file">＋ 添加图片</label>
            <input type="file" id="img-file" accept="image/*" multiple onchange="pickImages(event)" style="display:none">
        </div>
        <div id="thumbs" class="thumbs"></div>

        <div class="q">05 备注内容 <small>非必要情况勿填</small></div>
        <input id="note" placeholder="只有站长看得到">

        <button class="btn" onclick="submitPost()">提交，等站长审核</button>
        <div class="msg" id="msg"></div>
    </div>

    <div class="card">
        <div class="q" style="margin-top:0">我的投稿</div>
        <div id="mine"><div class="empty">加载中…</div></div>
    </div>
</div>

<script>
    const API = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api';
    const token = localStorage.getItem('wall_token');

    if (!token) location.replace('./account.html');

    function api(action, data) {
        const tk = localStorage.getItem('wall_token') || '';
        return fetch(API + '?action=' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ token: tk }, data || {}))
        }).then(r => r.json()).catch(() => ({ code: -1, message: '网络请求失败' }));
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function onAnonChange() {}

    async function submitPost() {
        const anonymous = document.getElementById('anonymous').checked;
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        const msg = document.getElementById('msg');

        if (!title) {
            msg.textContent = '标题不能空';
            msg.className = 'msg err';
            return;
        }
        if (!content) {
            msg.textContent = '正文不能空';
            msg.className = 'msg err';
            return;
        }

        const res = await api('createPost', {
            token,
            title,
            category: document.getElementById('category').value,
            content,
            images: imagesData,

            note: document.getElementById('note').value.trim(),
            anonymous
        });

        if (res.code === 200) {
            msg.textContent = res.message;
            msg.className = 'msg ok';
            document.getElementById('title').value = '';
            document.getElementById('content').value = '';
            imagesData = [];
            previews = [];
            renderThumbs();
            loadMine();
        } else if (res.code === 401) {
            location.replace('./account.html');
        } else {
            msg.textContent = res.message || '提交失败';
            msg.className = 'msg err';
        }
    }

    const STATUS = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
    let imagesData = [];
    let previews = [];

    function compressImage(file, maxSize, quality) {
        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', 0.72));
            };
            img.src = url;
        });
    }

    async function pickImages(e) {
        const files = Array.from(e.target.files || []);
        for (const file of files) {
            if (imagesData.length >= 6) break;
            const data = await compressImage(file, 1200, 0.72);
            const res = await api('uploadImage', { data });
            if (res.code === 200) {
                imagesData.push(res.url);
                previews.push(data);
            } else {
                alert(res.message || '图片上传失败');
            }
        }
        e.target.value = '';
        renderThumbs();
    }

    function renderThumbs() {
        document.getElementById('thumbs').innerHTML = previews.map((src, i) =>
            `<div class="thumb"><img src="${src}"><span onclick="removeImage(${i})">×</span></div>`
        ).join('');
    }

    function removeImage(i) {
        imagesData.splice(i, 1);
        previews.splice(i, 1);
        renderThumbs();
    }

    async function loadMine() {
        const box = document.getElementById('mine');
        const res = await api('myPosts', { token });
        if (res.code === 401) { location.replace('./account.html'); return; }
        if (res.code !== 200) { box.innerHTML = '<div class="empty">加载失败</div>'; return; }
        if (!res.data.length) { box.innerHTML = '<div class="empty">还没投过稿</div>'; return; }
        box.innerHTML = res.data.map(p => `
            <div class="mine">
                <div class="meta">
                    <span class="tag">${esc(p.category)}</span>${esc(p.author)} · ${esc(p.date)}
                    <span class="st ${esc(p.status)}">${STATUS[p.status] || p.status}</span>
                </div>
                <div class="txt"><b>${esc(p.title || '（无标题）')}</b><br>${esc(p.content.slice(0, 120))}${p.content.length > 120 ? '…' : ''}</div>
            </div>`).join('');
    }

    loadMine();
</script>
</body>
</html>
