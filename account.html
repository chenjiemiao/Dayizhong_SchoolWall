<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>账号 · 达一中校园墙</title>
    <style>
        :root { --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --muted:#aaa; --accent:#ff7675; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 18px; display:flex; justify-content:center; }
        .wrap { width:100%; max-width:420px; }
        .back { color:var(--muted); text-decoration:none; font-size:14px; }
        h1 { color:var(--accent); font-size:22px; margin:16px 0 20px; letter-spacing:1px; }
        .tabs { display:flex; gap:8px; margin-bottom:14px; }
        .tab { flex:1; padding:10px; border-radius:8px; border:1px solid #333; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; }
        .tab.active { background:var(--accent); color:#121212; border-color:var(--accent); font-weight:bold; }
        .card { background:var(--panel); border:1px solid #2a2a2a; border-radius:12px; padding:18px; }
        label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
        input, textarea { width:100%; padding:11px; border-radius:8px; border:1px solid #333; background:#161616; color:var(--text); font-size:14px; font-family:inherit; outline:none; }
        input:focus, textarea:focus { border-color:var(--accent); }
        .btn { width:100%; margin-top:16px; padding:12px; border:none; border-radius:8px; background:var(--accent); color:#121212; font-weight:bold; font-size:15px; cursor:pointer; }
        .btn.ghost { background:transparent; border:1px solid #555; color:var(--text); }
        .msg { margin-top:12px; font-size:13px; line-height:1.6; display:none; }
        .msg.ok { display:block; color:#55efc4; }
        .msg.err { display:block; color:#ff6b6b; }
        .hint { font-size:12px; color:#777; line-height:1.7; margin-top:14px; }
        .qr-block { margin-top:18px; padding-top:16px; border-top:1px dashed #333; }
        .qr-tip { font-size:13px; color:var(--muted); text-align:center; margin:0 0 12px; line-height:1.6; }
        .qr-group { display:flex; gap:12px; justify-content:center; }
        .qr-item { display:flex; flex-direction:column; align-items:center; width:46%; }
        .qr-item img { width:100%; max-width:130px; border-radius:8px; border:1px solid #444; }
        .qr-item span { font-size:12px; color:var(--muted); margin-top:6px; }
        .avatar-row { display:flex; align-items:center; gap:12px; margin:4px 0 4px; }
        .avatar-preview { width:64px; height:64px; border-radius:50%; border:1px solid #444; object-fit:cover; background:#161616; }
        .avatar-pick { display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid #444; color:var(--text); font-size:13px; cursor:pointer; margin:0; }
        .who { font-size:15px; margin:0 0 14px; }
    
        /* 全站动态背景 */
        .bg-media { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-media video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .bg-media .bg-mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,18,18,0.45) 0%, rgba(18,18,18,0.88) 100%); }
        .wrap, .container, .card, .pf-card, .modal-content { position: relative; z-index: 1; }
    </style>
<link rel="icon" href="./images/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="校园墙">
    <script>if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js?v=2').then(function (r) { r.update(); }).catch(function () {}); });;
</script>
</head>
<body>
<div class="bg-media" aria-hidden="true"><video autoplay muted loop playsinline preload="none"></video><div class="bg-mask"></div></div>
<script>
(function () {
  var v = document.querySelector('.bg-media video');
  var wide = window.matchMedia('(min-width: 1100px)').matches;
  v.src = wide
    ? 'https://syxpvkhmkvpenogatwkd.supabase.co/storage/v1/object/public/media/bg-1080.mp4'
    : 'https://syxpvkhmkvpenogatwkd.supabase.co/storage/v1/object/public/media/bg-720.mp4';
  v.play().catch(function () {});
})();
</script>

<div class="wrap">
    <a class="back" href="./index.html">← 返回首页</a>
    <h1>🍍 账号</h1>

    <div id="logged" class="card" hidden>
        <p class="who">已登录：<b id="who"></b></p>
        <button class="btn ghost" onclick="logout()">退出登录</button>
    </div>

    <div id="forms">
        <div class="tabs">
            <button class="tab active" data-tab="login">登录</button>
            <button class="tab" data-tab="reg">申请注册</button>
        </div>

        <div class="card" id="pane-login">
            <label>用户名</label>
            <input id="login-name" autocomplete="username" placeholder="注册时填的用户名">
            <label>密码</label>
            <input id="login-pass" type="password" autocomplete="current-password" placeholder="密码">
            <button class="btn" onclick="doLogin()">登录</button>
            <div class="msg" id="login-msg"></div>
            <p class="hint">忘密码了？找站长。</p>
        </div>

        <div class="card" id="pane-reg" hidden>
            <label>用户名（用来登录，别用真名）</label>
            <input id="reg-name" placeholder="2 到 24 位，字母数字下划线或中文">
            <label>昵称（展示用，必填）</label>
            <input id="reg-nick" maxlength="24" placeholder="别人看到的名字，比如：菠萝">
            <label>真实姓名（必填，只有站长看得到）</label>
            <input id="reg-realname" placeholder="填真名，只有站长看得到">
            <label>班级（必填，要带届）</label>
            <input id="reg-class" placeholder="比如：2025级9班">
            <label>密码</label>
            <input id="reg-pass" type="password" placeholder="至少 6 位">
            <label>头像（选填，不传就给你一个菠萝）</label>
            <div class="avatar-row">
                <img id="avatar-preview" class="avatar-preview" alt="头像预览">
                <label class="avatar-pick" for="avatar-file">选择图片</label>
                <input type="file" id="avatar-file" accept="image/*" onchange="pickAvatar(event)" style="display:none">
            </div>
            <label>联系方式（微信 / QQ，方便站长找到你）</label>
            <input id="reg-contact" placeholder="选填，但建议留">
            <label>人机验证</label>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
                <img id="cap-img" alt="验证码" onclick="loadCaptcha()"
                     style="display:none;height:52px;border-radius:6px;cursor:pointer;border:1px solid #333">
                <span id="cap-question" style="font-size:16px;color:#ff9a9e;min-width:110px">加载中…</span>
                <input id="cap-answer" maxlength="6" placeholder="验证码" style="max-width:120px">
                <button class="btn ghost" type="button" onclick="loadCaptcha()" style="padding:8px 12px">换一张</button>
            </div>
            <button class="btn" id="reg-btn" onclick="doRegister()">提交申请</button>
            <div class="msg" id="reg-msg"></div>
            <p class="hint">提交后不会立刻能用，要等站长在后台点通过。</p>

            <div class="qr-block">
                <p class="qr-tip">想加速审核？直接加站长私人联系方式催我</p>
                <div class="qr-group">
                    <div class="qr-item"><img src="images/wechat.jpg" alt="微信二维码"><span>微信</span></div>
                    <div class="qr-item"><img src="images/qq.jpg" alt="QQ二维码"><span>QQ</span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = 'https://syxpvkhmkvpenogatwkd.supabase.co/functions/v1/api';
        const SB_KEY = 'sb_publishable_loNoSfQ63RzVjHHRieKjpg_6HP0m5jk';
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23202020'/><text x='50' y='70' font-size='54' text-anchor='middle'>🍍</text></svg>";
    let avatarData = '';

    function compressImage(file, maxSize, quality) {
        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.src = url;
        });
    }

    async function pickAvatar(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        avatarData = await compressImage(file, 240, 0.8);
        document.getElementById('avatar-preview').src = avatarData;
    }

    function api(action, data) {
        return fetch(API + '?action=' + action, {
            method: 'POST',
            headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify(data || {})
        }).then(r => r.json()).catch(() => ({ code: -1, message: '网络请求失败，检查下网络再试' }));
    }

    function showMsg(id, text, ok) {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            document.getElementById('pane-login').hidden = t.dataset.tab !== 'login';
            document.getElementById('pane-reg').hidden = t.dataset.tab !== 'reg';
        });
    });

    async function doLogin() {
        const username = document.getElementById('login-name').value.trim();
        const password = document.getElementById('login-pass').value;
        if (!username || !password) return showMsg('login-msg', '用户名和密码都要填', false);
        const res = await api('login', { username, password });
        if (res.code === 200) {
            localStorage.setItem('wall_token', res.token);
            localStorage.setItem('wall_user', JSON.stringify(res.user));
            showMsg('login-msg', '登录成功，正在跳转…', true);
            setTimeout(() => location.href = './app.html', 600);
        } else {
            showMsg('login-msg', res.message || '登录失败', false);
        }
    }

    let captchaToken = '';

    async function loadCaptcha() {
        const q = document.getElementById('cap-question');
        const img = document.getElementById('cap-img');
        const a = document.getElementById('cap-answer');
        if (q) { q.textContent = '加载中…'; }
        if (img) { img.style.display = 'none'; }
        if (a) { a.value = ''; }
        try {
            const r = await fetch(API + '?action=issueCaptcha', { headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY } });
            const d = await r.json();
            if (d.code !== 200) {
                if (q) q.textContent = '验证码加载失败，点「换一张」';
                return;
            }
            captchaToken = d.token;
            if (d.image && img) {
                img.src = d.image;
                img.style.display = 'block';
                if (q) q.textContent = d.question || '请输入图片里的字符';
            } else if (d.question && q) {
                q.textContent = d.question;
            }
        } catch (e) {
            if (q) q.textContent = '网络异常，点「换一张」';
        }
    }

    async function doRegister() {
        const btn = document.getElementById('reg-btn');
        const body = {
            username: document.getElementById('reg-name').value.trim(),
            nickname: document.getElementById('reg-nick').value.trim(),
            realName: document.getElementById('reg-realname').value.trim(),
            className: document.getElementById('reg-class').value.trim(),
            password: document.getElementById('reg-pass').value,
            contact: document.getElementById('reg-contact').value.trim(),
            captchaToken: captchaToken,
            captchaAnswer: (document.getElementById('cap-answer') || {}).value || '',
            avatar: avatarData
        };
        btn.disabled = true;
        btn.textContent = '提交中…';
        if (!/^[0-9]{4}级.{1,10}班$/.test(body.className)) {
            showMsg('reg-msg', '班级要写清届，比如 2025级9班', false);
            return;
        }
        const res = await api('register', body);
        btn.disabled = false;
        btn.textContent = '提交申请';
        showMsg('reg-msg', res.message || (res.code === 200 ? '已提交' : '提交失败'), res.code === 200);
    }

    function logout() {
        localStorage.removeItem('wall_token');
        localStorage.removeItem('wall_user');
        location.reload();
    }

    (function init() {
        document.getElementById('avatar-preview').src = avatarData || DEFAULT_AVATAR;
        const token = localStorage.getItem('wall_token');
        if (!token) return;
        api('me', { token }).then(res => {
            if (res.code === 200) {
                document.getElementById('logged').hidden = false;
                document.getElementById('forms').hidden = true;
                document.getElementById('who').textContent = res.user.nickname + '（' + res.user.username + '）';
            } else {
                localStorage.removeItem('wall_token');
                localStorage.removeItem('wall_user');
            }
        }).catch(() => {});
    })();

    loadCaptcha();
    </script>
</body>
</html>
