<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 · 达一中校园树洞</title>
    <style>
        :root { --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --muted:#aaa; --accent:#ff7675; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 18px; }
        .wrap { max-width:520px; margin:0 auto; }
        .back { color:var(--muted); text-decoration:none; font-size:14px; }
        .card { background:var(--panel); border:1px solid #2a2a2a; border-radius:12px; padding:18px; margin-top:16px; }
        .profile { display:flex; align-items:center; gap:14px; }
        .avatar { width:72px; height:72px; border-radius:50%; object-fit:cover; border:1px solid #444; background:#161616; }
        .name { font-size:18px; font-weight:bold; }
        .meta { font-size:12px; color:var(--muted); margin-top:4px; }
        .btn { padding:9px 14px; border:none; border-radius:8px; background:var(--accent); color:#121212; font-weight:bold; font-size:13px; cursor:pointer; }
        .btn.ghost { background:transparent; border:1px solid #555; color:var(--text); }
        h2 { font-size:15px; margin:0 0 12px; color:var(--accent); }
        .title-opt { display:flex; align-items:center; gap:8px; padding:8px 0; font-size:14px; }
        .title-opt input { width:auto; }
        .grad { background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:bold; }
        .text-gold { background-image:linear-gradient(90deg,#f9ca24,#f6e58d,#f9ca24); }
        .text-diamond { background-image:linear-gradient(90deg,#74b9ff,#e0f7fa,#a29bfe,#74b9ff); }
        .text-rainbow { background-image:linear-gradient(90deg,#ff7675,#fdcb6e,#55efc4,#74b9ff,#a29bfe,#ff7675); }
        .text-admin { background-image:linear-gradient(90deg,#ff5252,#ff4081,#e040fb,#ff5252); }
        .post { border:1px solid #2a2a2a; border-radius:10px; padding:12px; margin-bottom:10px; background:#181818; }
        .post .pmeta { font-size:12px; color:var(--muted); margin-bottom:6px; }
        .post .ptxt { font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
        .st { display:inline-block; padding:1px 8px; border-radius:4px; font-size:12px; margin-left:6px; }
        .st.pending { background:rgba(253,203,110,.15); color:#fdcb6e; }
        .st.approved { background:rgba(85,239,196,.15); color:#55efc4; }
        .st.rejected { background:rgba(255,107,107,.15); color:#ff6b6b; }
        .empty { color:var(--muted); font-size:13px; }
        .msg { margin-top:10px; font-size:13px; display:none; }
        .msg.ok { display:block; color:#55efc4; }
        .msg.err { display:block; color:#ff6b6b; }
        .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .hint { font-size:12px; color:#777; line-height:1.7; margin:8px 0 0; }
    
        /* 全站动态背景 */
        .bg-media { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-media video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .bg-media .bg-mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,18,18,0.45) 0%, rgba(18,18,18,0.88) 100%); }
        .wrap, .container, .card, .pf-card, .modal-content { position: relative; z-index: 1; }
    </style>
</head>
<body>
<div class="bg-media" aria-hidden="true"><video autoplay muted loop playsinline preload="none"></video><div class="bg-mask"></div></div>
<script>
(function () {
  var v = document.querySelector('.bg-media video');
  var wide = window.matchMedia('(min-width: 1100px)').matches;
  v.src = wide
    ? './images/bg-1080.mp4'
    : './images/bg-720.mp4';
  v.play().catch(function () {});
})();
</script>

<div class="wrap">
    <a class="back" href="./app.html">← 返回校园墙</a>

    <div class="card profile">
        <img id="me-avatar" class="avatar" alt="头像">
        <div style="flex:1">
            <div class="name" id="me-name">加载中…</div>
            <div class="meta" id="me-meta"></div>
            <div class="row">
                <label class="btn ghost" for="avatar-file">换头像</label>
                <input type="file" id="avatar-file" accept="image/*" onchange="pickAvatar(event)" style="display:none">
            </div>
        </div>
    </div>
    <div class="msg" id="avatar-msg"></div>

    <div class="card">
        <h2>我的头衔</h2>
        <div id="titles"><div class="empty">加载中…</div></div>
        <div class="row">
            <button class="btn" onclick="saveTitles()">保存头衔</button>
        </div>
        <div class="msg" id="title-msg"></div>
        <p class="hint" id="title-hint"></p>
    </div>

    <div class="card">
        <h2>我发过的帖子</h2>
        <div id="posts"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
        <button class="btn ghost" onclick="logout()" style="width:100%">退出登录</button>
    </div>
</div>

<script>
    const API = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api';
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23202020'/><text x='50' y='70' font-size='54' text-anchor='middle'>🍍</text></svg>";
    const STATUS = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
    const token = localStorage.getItem('wall_token');
    let me = null;

    if (!token) location.replace('./account.html');

    function api(action, data) {
        return fetch(API + '?action=' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ token }, data || {}))
        }).then(r => r.json()).catch(() => ({ code: -1, message: '网络请求失败' }));
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function gradClass(t) {
        if (/Master|Admin/i.test(t)) return 'text-admin';
        if (t.indexOf('Stars++') >= 0) return 'text-diamond';
        if (t.indexOf('StarsPro') >= 0) return 'text-gold';
        return 'text-rainbow';
    }

    function titleLimit() {
        const owned = (me && me.titles) || [];
        return (me.role === 'admin' || owned.some(t => /Master|Admin/i.test(t))) ? 4 : 3;
    }

    async function loadMe() {
        const res = await api('me');
        if (res.code !== 200) { location.replace('./account.html'); return; }
        me = res.user;
        document.getElementById('me-avatar').src = me.avatar || DEFAULT_AVATAR;
        document.getElementById('me-name').textContent = me.nickname;
        document.getElementById('me-meta').textContent = '@' + me.username;
        renderTitles();
    }

    function renderTitles() {
        const box = document.getElementById('titles');
        const owned = me.titles || [];
        const equipped = me.equipped || [];
        if (!owned.length) {
            box.innerHTML = '<div class="empty">还没有头衔，去首页赞助页申请一个</div>';
            return;
        }
        box.innerHTML = owned.map(t => `
            <label class="title-opt">
                <input type="checkbox" value="${esc(t)}" ${equipped.indexOf(t) >= 0 ? 'checked' : ''}>
                <span class="grad ${gradClass(t)}">${esc(t)}</span>
            </label>`).join('');
        document.getElementById('title-hint').textContent =
            '最多同时展示 ' + titleLimit() + ' 个头衔' +
            (me.role === 'admin' ? '（站长多一个名额）' : '');
    }

    async function saveTitles() {
        const picked = Array.from(document.querySelectorAll('#titles input:checked')).map(i => i.value);
        const msg = document.getElementById('title-msg');
        if (picked.length > titleLimit()) {
            msg.textContent = '最多只能带 ' + titleLimit() + ' 个';
            msg.className = 'msg err';
            return;
        }
        const res = await api('updateTitles', { titles: picked });
        msg.textContent = res.message || '已保存';
        msg.className = 'msg ' + (res.code === 200 ? 'ok' : 'err');
        if (res.code === 200) me.equipped = res.equipped;
    }

    function compressImage(file, maxSize, quality) {
        return new Promise((resolve) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
            };
            img.src = url;
        });
    }

    async function pickAvatar(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const data = await compressImage(file, 240, 0.8);
        document.getElementById('me-avatar').src = data;
        const res = await api('updateAvatar', { avatar: data });
        const msg = document.getElementById('avatar-msg');
        msg.textContent = res.message || '已保存';
        msg.className = 'msg ' + (res.code === 200 ? 'ok' : 'err');
        if (res.code === 200) {
            const user = JSON.parse(localStorage.getItem('wall_user') || '{}');
            user.avatar = data;
            localStorage.setItem('wall_user', JSON.stringify(user));
        }
    }

    async function loadPosts() {
        const box = document.getElementById('posts');
        const res = await api('myPosts');
        if (res.code !== 200) { box.innerHTML = '<div class="empty">加载失败</div>'; return; }
        if (!res.data.length) { box.innerHTML = '<div class="empty">还没发过帖子</div>'; return; }
        box.innerHTML = res.data.map(p => `
            <div class="post">
                <div class="pmeta">${esc(p.category)} · ${esc(p.date)}<span class="st ${esc(p.status)}">${STATUS[p.status] || p.status}</span></div>
                <div class="ptxt">${esc(p.content.slice(0, 160))}${p.content.length > 160 ? '…' : ''}</div>
                <div class="row">
                    <button class="btn ghost" onclick="delPost('${p._id}')">删除这条</button>
                </div>
            </div>`).join('');
    }

    async function delPost(id) {
        if (!confirm('删了就找不回来了，确定？')) return;
        const res = await api('deletePost', { postId: id });
        if (res.code === 200) loadPosts();
        else alert(res.message || '删除失败');
    }

    function logout() {
        localStorage.removeItem('wall_token');
        localStorage.removeItem('wall_user');
        location.href = './account.html';
    }

    (async function init() {
        await loadMe();
        loadPosts();
    })();
</script>
</body>
</html>
