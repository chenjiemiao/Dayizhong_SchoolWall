<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>达一中 · 校园墙 v1.7</title>
    
    <style>
        /* ================= 核心变量与主题 ================= */
        :root {
            --bg-color: #121212; --panel-bg: rgba(30, 30, 30, 0.85); --text-main: #e0e0e0;
            --text-muted: #aaa; --border-color: #333; --accent-color: #ff7675;
            --accent-hover: #ff9f9e; --header-bg: rgba(18, 18, 18, 0.9); --shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        body.light-theme {
            --bg-color: #f4f6f9; --panel-bg: rgba(255, 255, 255, 0.95); --text-main: #333;
            --text-muted: #666; --border-color: #ddd; --accent-color: #ff5252;
            --accent-hover: #ff8a80; --header-bg: rgba(244, 246, 249, 0.95); --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        body { margin: 0; background-color: var(--bg-color); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* ================= 动态背景（视频） ================= */
        .bg-media { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-media video {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0.9; filter: saturate(0.95);
        }
        /* 只压一点点暗，保证文字能看，但不把视频盖死 */
        .bg-media .bg-mask {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(18,18,18,0.15) 0%, rgba(18,18,18,0.45) 55%, rgba(18,18,18,0.7) 100%);
        }
        body.light-theme .bg-media video { opacity: 0.85; }
        body.light-theme .bg-media .bg-mask {
            background: linear-gradient(180deg, rgba(244,246,249,0.2) 0%, rgba(244,246,249,0.55) 55%, rgba(244,246,249,0.75) 100%);
        }
        @media (prefers-reduced-motion: reduce) { .bg-media { display: none; } }
        
        /* 顶部导航 */
        .header { position: sticky; top: 0; z-index: 100; background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        .logo { font-size: 18px; font-weight: bold; color: var(--accent-color); cursor: pointer; }
        .btn-icon { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-icon:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* 主体布局 */
        .container { max-width: 800px; margin: 0 auto; padding: 20px; padding-bottom: 100px; position: relative; z-index: 1; }
        .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; font-size: 14px; }
        .filter-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); font-weight: bold; }

        /* 列表卡片 */
        .post-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow); transition: transform 0.2s; animation: fadeIn 0.4s ease; cursor: pointer; }
        .post-card:hover { transform: translateY(-2px); border-color: var(--accent-color); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .post-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; color: var(--text-muted); }
        .post-tag { background: rgba(255, 118, 117, 0.15); color: var(--accent-color); padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .post-author { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 2px 0 10px; font-size: 14px; }
        .author-name { color: var(--text-main); font-weight: bold; }
        .avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); background: #222; }
        .avatar-lg { width: 46px; height: 46px; }
        .detail-author { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        .author-name-lg { font-size: 18px; }
        .post-meta { font-size: 12px; color: var(--text-muted); }
        .post-class { font-size: 12px; color: var(--text-muted); margin-left: 6px; }
        .btn-del { padding: 10px 16px; border-radius: 8px; border: 1px solid #ff6b6b; background: transparent; color: #ff6b6b; font-size: 13px; cursor: pointer; }
        .post-title { font-size: 16px; font-weight: bold; margin: 0 0 8px; line-height: 1.4; }
        .post-footer { margin-top: 10px; font-size: 12px; color: var(--text-muted); }
        .card-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
        .card-imgs img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); }
        .detail-title { font-size: 22px; margin: 0 0 14px; line-height: 1.4; }
        .like-bar { margin: 18px 0; }
        .like-btn { padding: 9px 18px; border-radius: 20px; border: 1px solid var(--border-color); background: transparent; color: var(--text-main); font-size: 14px; cursor: pointer; }
        .like-btn.liked { border-color: var(--accent-color); color: var(--accent-color); opacity: .75; cursor: default; }
        .media-hint { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 95; background: var(--accent-color); color: #121212; font-size: 13px; font-weight: bold; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
        @keyframes bell-ring { 0%,100%{ transform: rotate(0); } 25%{ transform: rotate(-14deg); } 75%{ transform: rotate(14deg); } }
        #notice-btn.ring { animation: bell-ring .6s ease 3; border-color: var(--accent-color); color: var(--accent-color); }

        /* 个人主页（内置面板） */
        #notice-overlay { position: fixed; inset: 0; z-index: 310; background: var(--bg-color); display: none; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        #notice-overlay.active { display: flex; transform: translateX(0); }
        #publish-overlay { position: fixed; inset: 0; z-index: 320; background: var(--bg-color); display: none; flex-direction: column; transform: translateX(100%); transition: transform 0.3s ease; }
        #publish-overlay.active { display: flex; transform: translateX(0); }
        #publish-frame { flex: 1; width: 100%; border: 0; background: var(--bg-color); }
        #sponsor-overlay { position: fixed; inset: 0; z-index: 305; background: var(--bg-color); display: none; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        #sponsor-overlay.active { display: flex; transform: translateX(0); }
        #user-overlay { position: fixed; inset: 0; z-index: 315; background: var(--bg-color); display: none; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        #user-overlay.active { display: flex; transform: translateX(0); }
        .help-btn { position: fixed; left: 16px; bottom: 92px; z-index: 96; background: rgba(255,118,117,.92); color: #121212; border: none; border-radius: 22px; padding: 10px 16px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
        #help-overlay { position: fixed; inset: 0; z-index: 330; background: var(--bg-color); display: none; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        #help-overlay.active { display: flex; transform: translateX(0); }
        #profile-overlay { position: fixed; inset: 0; z-index: 300; background: var(--bg-color); display: none; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        #profile-overlay.active { display: flex; transform: translateX(0); }
        .pf-body { max-width: 620px; margin: 0 auto; padding: 20px; width: 100%; box-sizing: border-box; padding-bottom: 60px; }
        .pf-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
        .pf-top { display: flex; align-items: center; gap: 14px; }
        .pf-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1px solid #444; background: #161616; }
        .pf-name { font-size: 18px; font-weight: bold; }
        .pf-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
        .pf-btn { display: inline-block; margin-top: 8px; padding: 7px 12px; border-radius: 8px; border: 1px solid #555; color: var(--text-main); font-size: 13px; cursor: pointer; }
        .pf-card h3 { margin: 0 0 12px; font-size: 15px; color: var(--accent-color); }
        .pf-title-opt { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 14px; }
        .pf-title-opt input { width: auto; }
        .pf-save { margin-top: 12px; padding: 10px 16px; border-radius: 8px; border: none; background: var(--accent-color); color: #121212; font-weight: bold; font-size: 14px; cursor: pointer; }
        .pf-hint { font-size: 12px; color: #777; margin: 10px 0 0; }
        .pf-post { border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: rgba(0,0,0,0.15); }
        .pf-post .m { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .pf-post .t { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-bottom: 10px; }
        .pf-empty { color: var(--text-muted); font-size: 13px; }
        .pf-logout { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ff6b6b; background: transparent; color: #ff6b6b; font-size: 14px; cursor: pointer; }
        .pf-msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
        .pf-msg.ok { color: #55efc4; }
        .pf-msg.err { color: #ff6b6b; }
        body.light-theme .post-tag { background: rgba(255, 82, 82, 0.1); }

        /* 头衔渐变文字 */
        .text-gold, .text-diamond, .text-rainbow, .text-admin {
            background-size: 200% 100%;
            -webkit-background-clip: text; background-clip: text;
            color: transparent; font-weight: bold;
            animation: title-flow 3s linear infinite;
        }
        .text-gold { background-image: linear-gradient(90deg, #f9ca24, #f6e58d, #f9ca24); }
        .text-diamond { background-image: linear-gradient(90deg, #74b9ff, #e0f7fa, #a29bfe, #74b9ff); }
        .text-rainbow { background-image: linear-gradient(90deg, #ff7675, #fdcb6e, #55efc4, #74b9ff, #a29bfe, #ff7675); }
        .text-admin { background-image: linear-gradient(90deg, #ff5252, #ff4081, #e040fb, #ff5252); }
        @keyframes title-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: -200% 50%; }
        }
        .post-content { font-size: 15px; line-height: 1.6; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* 详情页遮罩层 */
        #detail-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(18,18,18,0.72); backdrop-filter: blur(10px); display: none; flex-direction: column; overflow-y: auto; transform: translateX(100%); transition: transform 0.3s ease; }
        body.light-theme #detail-overlay { background: rgba(244,246,249,0.85); }
        #detail-overlay.active { display: flex; transform: translateX(0); }
        .detail-header { position: sticky; top: 0; background: var(--header-bg); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); z-index: 10; }
        .back-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .detail-body { max-width: 800px; margin: 0 auto; padding: 20px; width: 100%; box-sizing: border-box; }
        .detail-content { font-size: 16px; line-height: 1.8; }

        /* 朋友圈九宫格图片 */
        .detail-content .img-container { display: grid; gap: 8px; margin: 15px 0; width: 100%; }
        .detail-content .img-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; cursor: zoom-in; border: 1px solid var(--border-color); aspect-ratio: 1 / 1; }
        .detail-content .img-container.single { grid-template-columns: 1fr; }
        .detail-content .img-container.single img { aspect-ratio: auto; max-height: 500px; }
        .detail-content .img-container.multiple { grid-template-columns: repeat(3, 1fr); }
        .detail-content .img-container.two-images { grid-template-columns: repeat(2, 1fr); }
        .detail-content .img-container.two-images img { aspect-ratio: auto; max-height: 300px; }

        /* 评论区容器 */
        .comment-section { margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .comment-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: var(--accent-color); }
        .comment-list { display: flex; flex-direction: column; gap: 10px; }
        .comment-item { background: rgba(0,0,0,.18); border: 1px solid var(--border-color); border-radius: 10px; padding: 10px 12px; }
        .comment-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .comment-head .avatar { width: 22px; height: 22px; }
        .comment-name { color: var(--text-main); font-weight: bold; font-size: 13px; }
        .comment-text { font-size: 14px; line-height: 1.6; word-break: break-word; }
        .del-comment { border: none; background: transparent; color: #ff6b6b; font-size: 12px; cursor: pointer; margin-left: 8px; }
        .reply-btn { border: none; background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; padding: 4px 0 0; }
        .reply-btn:hover { color: var(--accent-color); }
        .comment-child { margin-left: 24px; border-left: 2px solid var(--border-color); }
        .reply-hint { font-size: 12px; color: var(--accent-color); cursor: pointer; }
        .comment-form { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .comment-form textarea { width: 100%; min-height: 70px; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #161616; color: var(--text-main); font-family: inherit; font-size: 14px; resize: vertical; outline: none; }
        .comment-form .like-btn { align-self: flex-end; }
        
        .fab-btn { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent-color); color: #fff; padding: 12px 30px; border-radius: 30px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4); cursor: pointer; z-index: 90; }
        .music-btn { position: fixed; bottom: 90px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: var(--panel-bg); border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; z-index: 90; box-shadow: var(--shadow); }
        .music-btn.playing { animation: spin 3s linear infinite; color: var(--accent-color); border-color: var(--accent-color); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        #lightbox img { max-width: 95vw; max-height: 95vh; object-fit: contain; }
    </style>
</head>
<body>

    <!-- 动态背景：电脑 1080p 高码率，手机 720p 高码率 -->
    <div class="bg-media" aria-hidden="true">
        <video id="bg-video" autoplay muted loop playsinline preload="auto"></video>
        <div class="bg-mask"></div>
    </div>
    <script>
        (function () {
            var v = document.getElementById('bg-video');
            var wide = window.matchMedia('(min-width: 1100px)').matches;
            v.src = wide
                ? 'https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bg-1080.mp4'
                : 'https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bg-720.mp4';
            v.play().catch(function () {});
        })();
    </script>

    <!-- 暗号拦截 -->
    <div id="password-gate" style="position: fixed; inset: 0; z-index: 99999; background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
        <h1 style="color: var(--accent-color); font-size: 24px; margin-bottom: 10px;">🍍 达一中 · 内部空间</h1>
        <p style="color: var(--text-muted); margin-bottom: 30px;">请输入本周内部暗号</p>
        <input type="password" id="gate-input" placeholder="输入暗号..." style="width: 100%; max-width: 250px; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--panel-bg); color: var(--text-main); text-align: center; margin-bottom: 15px; outline: none;">
        <button onclick="checkPassword()" style="width: 100%; max-width: 250px; padding: 12px; border-radius: 8px; border: none; background: var(--accent-color); color: #fff; font-weight: bold; cursor: pointer;">进 入</button>
        <p id="gate-error" style="color: #ff5252; font-size: 14px; margin-top: 15px; display: none;">暗号错误，请重试！</p>
    </div>

    <header class="header">
        <div class="logo" onclick="closeDetail()">达一中 · 校园墙</div>
        <div class="controls">
            <a href="./title.html" class="btn-icon" style="margin-right:8px;">✨ 头衔</a>
            <button class="btn-icon" onclick="openSponsor()" style="margin-right:8px;">🍍 赞助</button>
            <button class="btn-icon" id="notice-btn" onclick="openNotices()" style="margin-right:8px;">🔔</button>
            <button class="btn-icon" id="account-btn" onclick="openProfile()" style="margin-right:8px;">👤 登录</button>
            <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()">🌙 暗黑</button>
        </div>
    </header>

    <div class="container" id="home-container">
        <div class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-filter="全部">🌟 全部</button>
            <button class="filter-btn" data-filter="通知">📢 通知</button>
            <button class="filter-btn" data-filter="日常">💬 日常</button>
            <button class="filter-btn" data-filter="表白">❤️ 表白</button>
            <button class="filter-btn" data-filter="交友">🤝 交友</button>
            <button class="filter-btn" data-filter="寻物">🔍 寻物</button>
            <button class="filter-btn" data-filter="反馈">📮 反馈</button>
        </div>
        <div id="posts-container"></div>
    </div>

    <div id="detail-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closeDetail()">⬅ 返回列表</button>
        </div>
        <div class="detail-body" id="detail-body"></div>
    </div>

    <div id="profile-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closeProfile()">⬅ 返回</button>
        </div>
        <div class="pf-body">
            <div class="pf-card">
                <div class="pf-top">
                    <img id="pf-avatar" class="pf-avatar" alt="">
                    <div>
                        <div class="pf-name" id="pf-name">未登录</div>
                        <div class="pf-meta" id="pf-meta"></div>
                        <label class="pf-btn" for="pf-avatar-file">换头像</label>
                        <button class="pf-btn" onclick="pfRename()">改名字</button>
                        <input type="file" id="pf-avatar-file" accept="image/*" onchange="pfPickAvatar(event)" style="display:none">
                    </div>
                </div>
                <div class="pf-msg" id="pf-avatar-msg"></div>
            </div>
            <div class="pf-card">
                <h3>我的头衔</h3>
                <div id="pf-titles"><div class="pf-empty">加载中…</div></div>
                <button class="pf-save" onclick="pfSaveTitles()">保存头衔</button>
                <p class="pf-hint" id="pf-title-hint"></p>
                <div class="pf-msg" id="pf-title-msg"></div>
            </div>
            <div class="pf-card">
                <h3>我的申请记录</h3>
                <div id="pf-records"><div class="pf-empty">加载中…</div></div>
            </div>
            <div class="pf-card">
                <h3>我发过的帖子</h3>
                <div id="pf-posts"><div class="pf-empty">加载中…</div></div>
            </div>
            <button class="pf-logout" onclick="pfLogout()">退出登录</button>
            <div id="pf-delete-area" style="margin-top:10px"></div>
        </div>
    </div>

    <div id="notice-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closeNotices()">⬅ 返回</button>
        </div>
        <div class="pf-body">
            <div class="pf-card">
                <h3>🔔 通知</h3>
                <div id="notice-list"><div class="pf-empty">加载中…</div></div>
            </div>
        </div>
    </div>

    <div id="media-hint" class="media-hint" onclick="enableMedia()">🔊 点我开启背景音乐</div>
    <div id="sponsor-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closeSponsor()">⬅ 返回</button>
        </div>
        <div class="pf-body">
            <div class="pf-card" style="text-align:center">
                <h3>🍍 赞助校园墙</h3>
                <p style="font-size:13px;color:#aaa;line-height:1.8">每一笔赞赏都会用在服务器和域名维护上。<br>长按下面的赞赏码付款，然后在「头衔」页传截图申请头衔。</p>
                <img src="images/sponsor.jpg" alt="赞赏码" style="width:200px;border-radius:10px;border:1px solid #333;margin:10px auto;display:block">
                <a class="btn-icon" href="./title.html" style="display:inline-block;text-decoration:none;margin-top:6px;">去申请头衔</a>
            </div>
        </div>
    </div>

    <div id="user-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closeUser()">⬅ 返回</button>
        </div>
        <div class="pf-body">
            <div class="pf-card">
                <div class="pf-top">
                    <img id="u-avatar" class="pf-avatar" alt="">
                    <div>
                        <div class="pf-name" id="u-name"></div>
                        <div class="pf-meta" id="u-meta"></div>
                    </div>
                </div>
                <div style="margin-top:12px">
                    <button class="btn-del" id="u-block" onclick="blockUser()">拉黑他</button>
                </div>
            </div>
            <div class="pf-card">
                <h3>他发过的帖子</h3>
                <div id="u-posts" class="pf-empty">加载中…</div>
            </div>
        </div>
    </div>

    <button class="help-btn" onclick="openHelp()">🆘 举报 / 加速审核 / 找暗号</button>

    <div id="help-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closeHelp()">⬅ 返回</button>
        </div>
        <div class="pf-body">
            <div class="pf-card" style="text-align:center">
                <h3>🆘 有问题找站长</h3>
                <p style="font-size:13px;color:#aaa;line-height:1.9">
                    举报违规帖子、催审核、忘了暗号，都可以加微信找我。<br>
                    不知道暗号也能进群问。
                </p>
                <img src="images/wechat.jpg" alt="站长微信" style="width:220px;max-width:80%;border-radius:10px;border:1px solid #333;margin:12px auto;display:block">
                <p style="font-size:12px;color:#fdcb6e">扫码加我微信，备注「校园墙」</p>
            </div>
        </div>
    </div>

    <button class="fab-btn" onclick="openPublish()">✍️ 写校园墙</button>

    <div id="publish-overlay">
        <div class="detail-header">
            <button class="back-btn" onclick="closePublish()">⬅ 返回</button>
        </div>
        <iframe id="publish-frame" src="about:blank" title="发布"></iframe>
    </div>
    <div class="music-btn" id="music-toggle" onclick="toggleMusic()">🔇</div>
    <audio id="bgm" loop preload="none">
        <source src="https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bgm.m4a" type="audio/mp4">
    </audio>
    <div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src=""></div>

    <script>
        // ==========================================
        // 核心配置与变量
        // ==========================================
        // 这里是你刚刚在腾讯云建好的云函数地址
        const API_BASE_URL = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api?action=posts';
        const API_ROOT = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api';

        // 没登录就别进主站
        if (!localStorage.getItem('wall_token')) {
            location.replace('./account.html');
        }

        // 暗号由后台控制，取不到就用默认的
        (function loadGate() {
            fetch(API_ROOT + '?action=getGate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
                .then((r) => r.json())
                .then((d) => { if (d && d.gate) window.__GATE_CODE = d.gate; })
                .catch(() => {});
        })();
        
        let currentFilter = '全部';
        let currentPostId = '';
        let wallData = []; // 用来存从数据库拉下来的数据

        function esc(str) {
            return String(str == null ? '' : str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        function titleClass(title) {
            if (!title) return '';
            if (title.indexOf('Master') >= 0 || title.indexOf('Admin') >= 0) return 'text-admin';
            if (title.indexOf('Stars++') >= 0) return 'text-diamond';
            if (title.indexOf('StarsPro') >= 0) return 'text-gold';
            return 'text-rainbow';
        }

        function titleHtml(title) {
            if (!title) return '';
            return ' <span class="' + titleClass(title) + '">' + esc(title) + '</span>';
        }

        function titlesHtml(post) {
            const list = Array.isArray(post.author_titles) && post.author_titles.length
                ? post.author_titles
                : (post.author_title ? [post.author_title] : []);
            return list.map((t) => titleHtml(t)).join('');
        }

        function avatarHtml(src, big) {
            if (!src) return '';
            return '<img class="avatar' + (big ? ' avatar-lg' : '') + '" src="' + esc(src) + '" alt="">';
        }

        async function resolveImages(list) {
            const ids = [];
            list.forEach((p) => {
                (p.images || []).forEach((x) => { if (String(x).indexOf('cloud://') === 0) ids.push(x); });
                if (p.author_avatar && String(p.author_avatar).indexOf('cloud://') === 0) ids.push(p.author_avatar);
            });
            if (!ids.length) return list;
            try {
                const r = await fetch(API_ROOT + '?action=imageUrls', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fileIds: ids })
                });
                const d = await r.json();
                const map = d.urls || {};
                return list.map((p) => Object.assign({}, p, {
                    images: (p.images || []).map((x) => map[x] || x),
                    author_avatar: map[p.author_avatar] || p.author_avatar
                }));
            } catch (e) {
                return list;
            }
        }

        // ==========================================
        // 从腾讯云拉取数据的函数
        // ==========================================
        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted);">数据加载中...</div>';
            
            try {
                // 向云函数发起请求
                const token = localStorage.getItem('wall_token');
                const url = API_BASE_URL + (token ? '&token=' + encodeURIComponent(token) : '');
                const response = await fetch(url);
                const result = await response.json();
                
                // 检查云函数返回状态
                if (result.code === 200 && result.data) {
                    // 把拉到的数据存到 wallData 里（顺便把云存储图片换成临时链接）
                    wallData = await resolveImages(result.data);
                    renderPosts(); // 重新渲染页面
                } else {
                    container.innerHTML = `<div style="text-align: center; color: red;">加载失败: ${result.message}</div>`;
                }
            } catch (error) {
                console.error("请求出错:", error);
                container.innerHTML = `<div style="text-align: center; color: red;">网络请求失败，请检查 F12 控制台。</div>`;
            }
        }

        // ==========================================
        // 渲染列表
        // ==========================================
        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            
            if (wallData.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-muted);">还没有帖子哦~</div>';
                return;
            }

            let sortedData = [...wallData].sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
            const filteredData = currentFilter === '全部' ? sortedData : sortedData.filter(item => item.category === currentFilter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.setAttribute('onclick', `openDetail('${item.id}')`);
                // 安全地截取纯文本内容
                let shortContent = (item.content || '').replace(/<[^>]+>/g, '');
                if(shortContent.length > 50) shortContent = shortContent.substring(0, 50) + '...';

                card.innerHTML = `
                    <div class="post-header">
                        <span class="post-tag">${item.category}</span>
                        <span>${item.date}</span>
                    </div>
                    <div class="post-author">
                        ${avatarHtml(item.author_avatar, false)}
                        <span class="author-name">@${esc(item.author)}</span>${titlesHtml(item)}${item.class_name ? `<span class="post-class">${esc(item.class_name)}</span>` : ''}
                    </div>
                    <div class="post-title">${esc(item.title || '（无标题）')}</div>
                    <div class="post-content">${shortContent}</div>
                    <div class="post-footer">
                        <span class="like-count">👍 ${(item.likes || []).length}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==========================================
        // 打开详情页
        // ==========================================
        async function openDetail(id) {
            const post = wallData.find(p => p.id === id);
            if (!post) return;
            currentPostId = id;

            const overlay = document.getElementById('detail-overlay');
            const body = document.getElementById('detail-body');

            let contentHtml = post.content || '';
            contentHtml = contentHtml.replace(/<加粗>(.*?)<\/加粗>/g, '<strong>$1</strong>');
            
            // 处理图片九宫格
            if (post.images && post.images.length > 0) {
                let imgGridClass = "multiple"; 
                if (post.images.length === 1) imgGridClass = "single";
                if (post.images.length === 2) imgGridClass = "two-images";

                let imgsHtml = `<div class="img-container ${imgGridClass}">`;
                post.images.forEach((imgPath) => {
                    imgsHtml += `<img src="${imgPath}" onclick="event.stopPropagation(); openLightbox('${imgPath}')">`;
                });
                imgsHtml += `</div>`;

                if (contentHtml.includes('<p1>')) {
                    contentHtml = contentHtml.replace(/<p1>/g, imgsHtml);
                } else {
                    contentHtml += imgsHtml;
                }
            }
            contentHtml = contentHtml.replace(/<p[2-9]>/g, '');

            const me = (function () {
                try { return JSON.parse(localStorage.getItem('wall_user') || 'null'); } catch (e) { return null; }
            })();
            const canDelete = me && post.created_by === me.username;
            const deleteHtml = canDelete
                ? '<div style="margin:18px 0;"><button class="btn-del" onclick="deleteOwnPost(\'' + post._id + '\')">删除这条帖子</button></div>'
                : '';

            body.innerHTML = `
        <h2 class="detail-title">${esc(post.title || '')}</h2>
                <div class="detail-author">
                    <span onclick="openUser('${post.created_by || ''}')" style="cursor:pointer">${avatarHtml(post.author_avatar, true)}</span>
                    <div class="detail-author-info">
                        <div class="author-name author-name-lg">@${esc(post.author)}${titlesHtml(post)}</div>
                        <div class="post-meta">${post.date} · ${post.category}${post.class_name ? ' · ' + esc(post.class_name) : ''}</div>
                    </div>
                </div>
                <div class="detail-content">${contentHtml}</div>
                <div class="like-bar">
                    <button class="like-btn ${post.liked ? 'liked' : ''}" ${post.liked ? 'disabled' : ''} onclick="likePost('${post._id}')">
                        👍 ${post.liked ? '已赞' : '点赞'} <span id="like-num">${(post.likes || []).length}</span>
                    </button>
                </div>
                ${deleteHtml}
                <div class="comment-section">
                    <div class="comment-title">💬 评论</div>
                    <div id="comment-list" class="comment-list">加载中…</div>
                    <div class="comment-form">
                        <div id="reply-hint" class="reply-hint" hidden></div>
                        <textarea id="comment-input" maxlength="500" placeholder="说点什么…"></textarea>
                        <button class="like-btn" onclick="submitComment('${post._id}')">发表评论</button>
                    </div>
                </div>
            `;

            overlay.classList.add('active');
            loadComments(post._id);
        }

        async function likePost(id) {
            const token = localStorage.getItem('wall_token');
            if (!token) { alert('登录后才能点赞'); return; }
            try {
                const res = await fetch(API_ROOT + '?action=likePost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, postId: id })
                });
                const data = await res.json();
                if (data.code === 200) {
                    const btn = document.querySelector('.like-btn');
                    if (btn) {
                        btn.classList.add('liked');
                        btn.disabled = true;
                        btn.innerHTML = '👍 已赞 <span>' + data.count + '</span>';
                    }
                    const post = wallData.find((p) => p._id === id);
                    if (post) { post.liked = true; post.likes = new Array(data.count).fill('x'); }
                } else {
                    alert(data.message || '点赞失败');
                }
            } catch (e) {
                alert('网络请求失败');
            }
        }

        async function loadComments(postId) {
            const box = document.getElementById('comment-list');
            if (!box) return;
            box.textContent = '加载中…';
            try {
                const r = await fetch(API_ROOT + '?action=comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ postId })
                });
                const d = await r.json();
                if (d.code !== 200) { box.textContent = '加载失败'; return; }
                if (!d.data.length) { box.textContent = '还没有评论，来抢第一'; return; }
                const me = (function () { try { return JSON.parse(localStorage.getItem('wall_user') || 'null'); } catch (e) { return null; } })();
                const staff = me && (me.role === 'owner' || me.role === 'admin');
                function commentCard(c, child) {
                    return `<div class="comment-item ${child ? 'comment-child' : ''}">
                        <div class="comment-head">
                            ${c.avatar ? `<img class="avatar" src="${esc(c.avatar)}" alt="">` : ''}
                            <span class="comment-name">${esc(c.nickname)}</span>
                            ${(c.titles || []).map((t) => `<span class="${titleClass(t)}">${esc(t)}</span>`).join('')}
                            <span style="margin-left:auto">${new Date(c.created_at).toLocaleString('zh-CN', { hour12: false })}</span>
                            ${(staff || (me && c.username === me.username)) ? `<button class="del-comment" onclick="deleteComment('${c._id}','${postId}')">删除</button>` : ''}
                        </div>
                        <div class="comment-text">${esc(c.content)}</div>
                        ${child ? '' : `<button class="reply-btn" onclick="replyTo('${c._id}','${esc(c.nickname)}')">回复</button>`}
                    </div>`;
                }
                const tops = d.data.filter((c) => !c.parent_id);
                const kids = d.data.filter((c) => c.parent_id);
                box.innerHTML = tops.map((c) =>
                    commentCard(c, false) + kids.filter((k) => k.parent_id === c._id).map((k) => commentCard(k, true)).join('')
                ).join('');
            } catch (e) {
                box.textContent = '网络请求失败';
            }
        }

        let replyParent = null;

        function replyTo(id, name) {
            replyParent = id;
            const hint = document.getElementById('reply-hint');
            if (!hint) return;
            hint.hidden = false;
            hint.textContent = '正在回复 @' + name + '（点这里取消）';
            hint.onclick = function () {
                replyParent = null;
                hint.hidden = true;
            };
            document.getElementById('comment-input').focus();
        }

        async function submitComment(postId) {
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text) { alert('评论不能空'); return; }
            const token = localStorage.getItem('wall_token');
            if (!token) { alert('登录后才能评论'); return; }
            try {
                const r = await fetch(API_ROOT + '?action=addComment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, postId, content: text, parentId: replyParent || '' })
                });
                const d = await r.json();
                if (d.code === 200) {
                    input.value = '';
                    replyParent = null;
                    const hint = document.getElementById('reply-hint');
                    if (hint) hint.hidden = true;
                    loadComments(postId);
                } else {
                    alert(d.message || '评论失败');
                }
            } catch (e) {
                alert('网络请求失败');
            }
        }

        async function deleteComment(id, postId) {
            if (!confirm('删掉这条评论？')) return;
            const token = localStorage.getItem('wall_token');
            try {
                const r = await fetch(API_ROOT + '?action=deleteComment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, id })
                });
                const d = await r.json();
                if (d.code === 200) loadComments(postId); else alert(d.message || '删除失败');
            } catch (e) {
                alert('网络请求失败');
            }
        }

        function closeDetail() {
            document.getElementById('detail-overlay').classList.remove('active');
            currentPostId = '';
        }

        async function deleteOwnPost(id) {            if (!confirm('删了就找不回来了，确定？')) return;
            const token = localStorage.getItem('wall_token');
            try {
                const res = await fetch(API_ROOT + '?action=deletePost', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, postId: id })
                });
                const data = await res.json();
                if (data.code === 200) {
                    closeDetail();
                    fetchPosts();
                } else {
                    alert(data.message || '删除失败');
                }
            } catch (e) {
                alert('网络请求失败');
            }
        }

        // ==========================================
        // 其他交互逻辑
        // ==========================================
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.getAttribute('data-filter');
                renderPosts();
            });
        });

        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-theme'); themeBtn.innerHTML = '☀️ 明亮'; }
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            if (document.body.classList.contains('light-theme')) { localStorage.setItem('theme', 'light'); themeBtn.innerHTML = '☀️ 明亮'; } 
            else { localStorage.setItem('theme', 'dark'); themeBtn.innerHTML = '🌙 暗黑'; }
        }

        const bgm = document.getElementById('bgm');
        const musicBtn = document.getElementById('music-toggle');
        let isPlaying = false;
        let userPaused = false; // 用户自己按了暂停，就别再自作聪明地自动播
        let mediaStarted = false;
        bgm.volume = 0.6;

        function setMusicUI(playing) {
            isPlaying = playing;
            if (playing) mediaStarted = true;
            const hint = document.getElementById('media-hint');
            if (hint && playing) hint.style.display = 'none';
            musicBtn.classList.toggle('playing', playing);
            musicBtn.innerHTML = playing ? '🎵' : '🔇';
        }

        // 按钮状态直接跟着 audio 的真实状态走，别再自己猜
        bgm.addEventListener('play', () => setMusicUI(true));
        bgm.addEventListener('pause', () => { if (!userPaused) setMusicUI(false); });
        bgm.addEventListener('error', () => {
            musicBtn.classList.remove('playing');
            musicBtn.innerHTML = '🚫';
        });

        // 浏览器不允许无交互自动播放，所以只要有第一次点击/按键就开播
        function tryPlayMusic() {
            if (!bgm.paused || userPaused) return;
            bgm.play().catch(() => {});
        }

        function toggleMusic() {
            if (!bgm.paused) {
                userPaused = true;
                bgm.pause();
                setMusicUI(false);
                return;
            }
            userPaused = false;
            bgm.play().then(() => setMusicUI(true)).catch(() => {
                musicBtn.innerHTML = '🚫';
                setTimeout(() => { if (bgm.paused) musicBtn.innerHTML = '🔇'; }, 1500);
            });
        }

        ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
            document.addEventListener(evt, tryPlayMusic, { once: true, passive: true });
        });

        // 手机切后台、锁屏、省电模式会把视频和音乐按停，发现就重新拉起来
        const bgVideoEl = document.querySelector('.bg-media video');

        function keepMediaAlive() {
            if (document.visibilityState !== 'visible') return;
            if (bgVideoEl && bgVideoEl.paused) bgVideoEl.play().catch(() => {});
            if (mediaStarted && !userPaused && bgm.paused) {
                bgm.play().catch(() => {});
            }
        }

        document.addEventListener('visibilitychange', () => setTimeout(keepMediaAlive, 300));
        window.addEventListener('focus', () => setTimeout(keepMediaAlive, 300));
        window.addEventListener('pageshow', () => setTimeout(keepMediaAlive, 300));
        setInterval(keepMediaAlive, 1500);

        function enableMedia() {
            userPaused = false;
            const hint = document.getElementById('media-hint');
            if (hint) hint.style.display = 'none';
            if (bgVideoEl && bgVideoEl.paused) bgVideoEl.play().catch(() => {});
            bgm.play().then(() => setMusicUI(true)).catch(() => {});
        }

        setTimeout(() => {
            const hint = document.getElementById('media-hint');
            if (hint && !mediaStarted) hint.style.display = 'block';
        }, 4000);

        if (bgVideoEl) {
            ['pause', 'stalled', 'suspend'].forEach((evt) => {
                bgVideoEl.addEventListener(evt, () => {
                    setTimeout(() => {
                        if (bgVideoEl.paused) bgVideoEl.play().catch(() => {});
                    }, 600);
                });
            });
            bgVideoEl.addEventListener('ended', () => {
                bgVideoEl.play().catch(() => {});
            });
            bgVideoEl.addEventListener('error', () => {
                bgVideoEl.style.display = 'none';
            });
        }

        function openLightbox(src) {
            event.stopPropagation();
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

        // ==========================================
        // 暗号验证与启动
        // ==========================================
        function checkPassword() {
            const input = document.getElementById('gate-input').value.trim();
            const errorMsg = document.getElementById('gate-error');
            const SECRET_CODE = window.__GATE_CODE || "V50";

            if (input === SECRET_CODE) {
                document.getElementById('password-gate').style.display = 'none';
                document.body.style.overflow = 'auto';
                // 进墙就开音乐（点击“进入”本身就是一次用户交互）
                tryPlayMusic();
                // 密码输入正确后，立刻去拉取数据库里的帖子
                fetchPosts();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('gate-input').value = '';
            }
        }

        // ==========================================
        // 个人主页（内置，不跳页，免得重输暗号）
        // ==========================================
        const PF_DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23202020'/><text x='50' y='70' font-size='54' text-anchor='middle'>🍍</text></svg>";
        let pfMe = null;

        function pfApi(action, data) {
            const token = localStorage.getItem('wall_token');
            return fetch(API_ROOT + '?action=' + action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(Object.assign({ token }, data || {}))
            }).then((r) => r.json()).catch(() => ({ code: -1, message: '网络请求失败' }));
        }

        function openProfile() {
            if (!localStorage.getItem('wall_token')) { location.href = './account.html'; return; }
            document.getElementById('profile-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            pfLoad();
        }

        function closeProfile() {
            document.getElementById('profile-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        let profileUser = '';

        async function openUser(username) {
            if (!username) return;
            profileUser = username;
            document.getElementById('user-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
            const box = document.getElementById('u-posts');
            box.textContent = '加载中…';
            try {
                const r = await fetch(API_ROOT + '?action=publicProfile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const d = await r.json();
                if (d.code !== 200) { box.textContent = d.message || '加载失败'; return; }
                document.getElementById('u-avatar').src = d.user.avatar || PF_DEFAULT_AVATAR;
                document.getElementById('u-name').textContent = d.user.nickname;
                document.getElementById('u-meta').textContent = '@' + d.user.username + (d.user.class_name ? ' · ' + d.user.class_name : '');
                let meName = '';
                try { meName = JSON.parse(localStorage.getItem('wall_user') || '{}').username || ''; } catch (e) {}
                document.getElementById('u-block').style.display = (d.user.username === meName) ? 'none' : 'inline-block';
                box.innerHTML = (d.posts || []).length
                    ? d.posts.map((p) => `<div class="pf-post"><div class="m">${esc(p.category)} · ${esc(p.date)}</div><div class="t"><b>${esc(p.title || '')}</b><br>${esc((p.content || '').slice(0, 100))}</div></div>`).join('')
                    : '<div class="pf-empty">还没发过帖子</div>';
            } catch (e) {
                box.textContent = '网络请求失败';
            }
        }

        function openHelp() {
            document.getElementById('help-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeHelp() {
            document.getElementById('help-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeUser() {
            document.getElementById('user-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        async function blockUser() {
            if (!profileUser) return;
            if (!confirm('拉黑后他的帖子不会再显示给你，确定？')) return;
            const res = await pfApi('blockUser', { username: profileUser });
            alert(res.message || '完成');
            if (res.code === 200) { closeUser(); fetchPosts(); }
        }

        function openSponsor() {
            document.getElementById('sponsor-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSponsor() {
            document.getElementById('sponsor-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function openPublish() {
            if (!localStorage.getItem('wall_token')) { location.href = './account.html'; return; }
            const f = document.getElementById('publish-frame');
            f.src = './publish.html?embed=1&v=' + Date.now();
            document.getElementById('publish-overlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePublish() {
            document.getElementById('publish-overlay').classList.remove('active');
            document.body.style.overflow = 'auto';
            fetchPosts();
        }

        async function pfLoad() {
            const res = await pfApi('me');
            if (res.code !== 200) { location.href = './account.html'; return; }
            pfMe = res.user;
            document.getElementById('pf-avatar').src = pfMe.avatar || PF_DEFAULT_AVATAR;
            document.getElementById('pf-name').textContent = pfMe.nickname;
            document.getElementById('pf-meta').textContent = '@' + pfMe.username;
            pfRenderTitles();
            pfLoadPosts();
            pfLoadRecords();
            pfRenderDeleteArea();
        }

        async function pfLoadRecords() {
            const box = document.getElementById('pf-records');
            const res = await pfApi('checkStatus', { username: pfMe.username });
            if (res.code !== 200) { box.innerHTML = '<div class="pf-empty">加载失败</div>'; return; }
            const map = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
            let html = '';
            (res.accountRequests || []).forEach((r) => {
                html += '<div class="pf-post"><div class="m">注册申请 · ' + (map[r.status] || r.status) + '</div></div>';
            });
            (res.titleRequests || []).forEach((t) => {
                html += '<div class="pf-post"><div class="m">头衔「' + esc(t.title) + '」 · ' + (map[t.status] || t.status) + '</div></div>';
            });
            box.innerHTML = html || '<div class="pf-empty">还没有申请记录</div>';
        }

        function pfRenderDeleteArea() {
            const box = document.getElementById('pf-delete-area');
            if (pfMe.status === 'deleting' && pfMe.delete_after) {
                const d = new Date(pfMe.delete_after).toLocaleString('zh-CN', { hour12: false });
                box.innerHTML = '<div class="pf-empty" style="margin-bottom:8px">账号将在 ' + d + ' 注销，帖子会保留并显示为「已注销账号」</div>' +
                    '<button class="pf-logout" onclick="pfCancelDelete()">撤销注销</button>';
            } else {
                box.innerHTML = '<button class="pf-logout" onclick="pfRequestDelete()">注销账号（7 天冷静期）</button>';
            }
        }

        async function pfRequestDelete() {
            if (!confirm('注销后有 7 天冷静期，期间可以撤销。到期后账号消失，帖子会保留并显示为「已注销账号」。确定申请？')) return;
            const password = prompt('输入密码确认');
            if (password === null) return;
            const res = await pfApi('requestDelete', { password });
            alert(res.message || '已提交');
            if (res.code === 200) pfLoad();
        }

        async function pfCancelDelete() {
            const res = await pfApi('cancelDelete');
            alert(res.message || '已撤销');
            if (res.code === 200) pfLoad();
        }

        function pfTitleLimit() {
            const owned = (pfMe && pfMe.titles) || [];
            return (pfMe.role === 'admin' || owned.some((t) => /Master|Admin/i.test(t))) ? 4 : 3;
        }

        function titleRank(t) {
            if (t.indexOf('StarsPro') >= 0) return 1;
            if (t.indexOf('Stars++') >= 0) return 2;
            if (/Master|Admin/.test(t)) return 4;
            return 3;
        }

        function pfRenderTitles() {
            const box = document.getElementById('pf-titles');
            const owned = (pfMe.titles || []).slice().sort((a, b) => titleRank(a) - titleRank(b));
            const equipped = pfMe.equipped || [];
            if (!owned.length) {
                box.innerHTML = '<div class="pf-empty">还没有头衔，去首页赞助页申请</div>';
                document.getElementById('pf-title-hint').textContent = '';
                return;
            }
            box.innerHTML = owned.map((t) => `
                <label class="pf-title-opt">
                    <input type="checkbox" value="${esc(t)}" ${equipped.indexOf(t) >= 0 ? 'checked' : ''}>
                    <span class="${titleClass(t)}">${esc(t)}</span>
                </label>`).join('');
            document.getElementById('pf-title-hint').textContent = '最多同时展示 ' + pfTitleLimit() + ' 个';
        }

        async function pfSaveTitles() {
            const picked = Array.from(document.querySelectorAll('#pf-titles input:checked')).map((i) => i.value);
            const msg = document.getElementById('pf-title-msg');
            if (picked.length > pfTitleLimit()) {
                msg.textContent = '最多只能带 ' + pfTitleLimit() + ' 个';
                msg.className = 'pf-msg err';
                return;
            }
            const res = await pfApi('updateTitles', { titles: picked });
            msg.textContent = res.message || '已保存';
            msg.className = 'pf-msg ' + (res.code === 200 ? 'ok' : 'err');
            if (res.code === 200) pfMe.equipped = res.equipped;
        }

        const PF_STATUS = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };

        async function pfLoadPosts() {            const box = document.getElementById('pf-posts');
            const res = await pfApi('myPosts');
            if (res.code !== 200) { box.innerHTML = '<div class="pf-empty">加载失败</div>'; return; }
            if (!res.data.length) { box.innerHTML = '<div class="pf-empty">还没发过帖子</div>'; return; }
            box.innerHTML = res.data.map((p) => `
                <div class="pf-post">
                    <div class="m">${esc(p.category)} · ${esc(p.date)} · ${PF_STATUS[p.status] || p.status}</div>
                    <div class="t">${esc(p.content.slice(0, 140))}${p.content.length > 140 ? '…' : ''}</div>
                    <button class="btn-del" onclick="pfDeletePost('${p._id}')">删除这条</button>
                </div>`).join('');
        }

        async function pfDeletePost(id) {
            if (!confirm('删了就找不回来了，确定？')) return;
            const res = await pfApi('deletePost', { postId: id });
            if (res.code === 200) { pfLoadPosts(); fetchPosts(); }
            else alert(res.message || '删除失败');
        }

        function pfCompress(file, maxSize, quality) {
            return new Promise((resolve) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = url;
            });
        }

        async function pfRename() {
            const name = prompt('新的昵称（最多 24 个字）', pfMe.nickname);
            if (!name || !name.trim()) return;
            const res = await pfApi('updateNickname', { nickname: name.trim() });
            alert(res.message || '完成');
            if (res.code === 200) {
                pfMe.nickname = name.trim();
                document.getElementById('pf-name').textContent = pfMe.nickname;
                fetchPosts();
            }
        }

        async function pfPickAvatar(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const data = await pfCompress(file, 240, 0.8);
            document.getElementById('pf-avatar').src = data;
            const msg = document.getElementById('pf-avatar-msg');
            const res = await pfApi('updateAvatar', { avatar: data });
            msg.textContent = res.message || '已保存';
            msg.className = 'pf-msg ' + (res.code === 200 ? 'ok' : 'err');
            if (res.code === 200) {
                try {
                    const user = JSON.parse(localStorage.getItem('wall_user') || '{}');
                    user.avatar = data;
                    localStorage.setItem('wall_user', JSON.stringify(user));
                } catch (err) {}
            }
        }

        function pfLogout() {
            localStorage.removeItem('wall_token');
            localStorage.removeItem('wall_user');
            location.reload();
        }

        function noticeDing() {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'sine';
                o.frequency.value = 880;
                g.gain.value = 0.12;
                o.connect(g);
                g.connect(ctx.destination);
                o.start();
                o.stop(ctx.currentTime + 0.18);
            } catch (e) {}
        }

        async function pollNotices() {
            if (!localStorage.getItem('wall_token')) return;
            const res = await pfApi('myNotices');
            if (res.code !== 200) return;
            const seen = Number(localStorage.getItem('notice_seen') || 0);
            const unread = (res.data || []).filter((n) => n.created_at > seen).length;
            const btn = document.getElementById('notice-btn');
            if (unread > 0) {
                btn.textContent = '🔔' + unread;
                btn.classList.add('ring');
                if (!window.__notified) { noticeDing(); window.__notified = true; }
            } else {
                btn.textContent = '🔔';
                btn.classList.remove('ring');
            }
        }

        async function openNotices() {
            if (!localStorage.getItem('wall_token')) { alert('登录后就能看通知'); return; }
            document.getElementById('notice-overlay').classList.add('active');
            const box = document.getElementById('notice-list');
            box.innerHTML = '<div class="pf-empty">加载中…</div>';
            const res = await pfApi('myNotices');
            if (res.code !== 200) { box.innerHTML = '<div class="pf-empty">加载失败</div>'; return; }
            if (!res.data.length) { box.innerHTML = '<div class="pf-empty">没有通知</div>'; return; }
            box.innerHTML = res.data.map((n) => `
                <div class="pf-post">
                    <div class="m">${new Date(n.created_at).toLocaleString('zh-CN', { hour12: false })}</div>
                    <div class="t">${esc(n.text)}</div>
                </div>`).join('');
            localStorage.setItem('notice_seen', String(Date.now()));
            document.getElementById('notice-btn').textContent = '🔔';
            document.getElementById('notice-btn').classList.remove('ring');
        }

        function closeNotices() {
            document.getElementById('notice-overlay').classList.remove('active');
        }


        document.getElementById('password-gate').style.display = 'flex';
        document.body.style.overflow = 'hidden';

        // 顶部显示登录状态
        (function () {
            const btn = document.getElementById('account-btn');
            const raw = localStorage.getItem('wall_user');
            if (btn && raw) {
                try { btn.textContent = '👤 ' + JSON.parse(raw).nickname; } catch (e) {}
            }
            pollNotices();
            setInterval(pollNotices, 20000);
        })();

    </script>
</body>
</html>
