<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>站长后台 · 达一中校园树洞</title>
    <style>
        :root { --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --muted:#aaa; --accent:#ff7675; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 18px; }
        .wrap { max-width:760px; margin:0 auto; }
        .back { color:var(--muted); text-decoration:none; font-size:14px; }
        h1 { color:var(--accent); font-size:22px; margin:16px 0 18px; }
        h2 { font-size:16px; margin:0 0 12px; color:var(--accent); }
        .card { background:var(--panel); border:1px solid #2a2a2a; border-radius:12px; padding:18px; margin-bottom:16px; }
        label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
        input { width:100%; padding:11px; border-radius:8px; border:1px solid #333; background:#161616; color:var(--text); font-size:14px; outline:none; }
        .btn { padding:10px 16px; border:none; border-radius:8px; background:var(--accent); color:#121212; font-weight:bold; cursor:pointer; font-size:14px; }
        .btn.ghost { background:transparent; border:1px solid #555; color:var(--text); }
        .btn.ok { background:#55efc4; }
        .btn.no { background:#636e72; color:#fff; }
        .row { display:flex; gap:8px; flex-wrap:wrap; }
        .item { border:1px solid #2a2a2a; border-radius:10px; padding:14px; margin-bottom:10px; background:#181818; }
        .item .meta { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.6; }
        .item .body { font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word; margin-bottom:12px; }
        .empty { color:var(--muted); font-size:13px; padding:6px 0; }
        .msg { margin-top:10px; font-size:13px; display:none; }
        .msg.err { display:block; color:#ff6b6b; }
        .msg.ok { display:block; color:#55efc4; }
        .tag { display:inline-block; padding:1px 8px; border-radius:4px; background:rgba(255,118,117,.15); color:var(--accent); font-size:12px; margin-right:6px; }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back" href="./index.html">← 返回首页</a>
    <h1>🔐 站长后台</h1>

    <div class="card" id="login-card">
        <label>管理密码</label>
        <div class="row">
            <input id="admin-pw" type="password" style="flex:1;min-width:200px" placeholder="云函数里那个 ADMIN_PASSWORD">
            <button class="btn" onclick="enter()">进入</button>
        </div>
        <div class="msg" id="login-msg"></div>
    </div>

    <div id="panel" hidden>
        <div class="card">
            <h2>待审核账号 <span id="user-count" class="tag"></span></h2>
            <div id="user-list"><div class="empty">加载中…</div></div>
        </div>
        <div class="card">
            <h2>待审核帖子 <span id="post-count" class="tag"></span></h2>
            <div id="post-list"><div class="empty">加载中…</div></div>
        </div>
        <div class="card">
            <h2>待审核头衔 <span id="title-count" class="tag"></span></h2>
            <div id="title-list"><div class="empty">加载中…</div></div>
        </div>
        <button class="btn ghost" onclick="reload()">刷新</button>
    </div>
</div>

<script>
    const API = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api';
    let adminPassword = '';

    function api(action, data) {
        return fetch(API + '?action=' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ adminPassword }, data || {}))
        }).then(r => r.json());
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function time(t) {
        return t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '';
    }

    async function enter() {
        const pw = document.getElementById('admin-pw').value;
        if (!pw) return;
        adminPassword = pw;
        const res = await api('adminRequests');
        if (res.code === 403) {
            const m = document.getElementById('login-msg');
            m.textContent = '密码不对';
            m.className = 'msg err';
            return;
        }
        document.getElementById('login-card').hidden = true;
        document.getElementById('panel').hidden = false;
        renderUsers(res.data || []);
        reloadPosts();
        reloadTitles();
    }

    async function reload() {
        const res = await api('adminRequests');
        if (res.code === 200) renderUsers(res.data);
        reloadPosts();
        reloadTitles();
    }

    async function reloadPosts() {
        const res = await api('adminPosts');
        if (res.code === 200) renderPosts(res.data);
    }

    async function reloadTitles() {
        const res = await api('adminTitles');
        if (res.code === 200) renderTitles(res.data);
    }

    function renderTitles(list) {
        const box = document.getElementById('title-list');
        document.getElementById('title-count').textContent = list.length;
        if (!list.length) { box.innerHTML = '<div class="empty">没有待审核的头衔申请</div>'; return; }
        box.innerHTML = list.map(t => `
            <div class="item">
                <div class="meta">${esc(t.nickname)}（${esc(t.username)}）申请 <b>${esc(t.title)}</b> · 金额 ${esc(t.amount || '未填')} · ${time(t.created_at)}</div>
                <div class="body">证明：${esc(t.proof || '没填')}</div>
                <div class="row">
                    <button class="btn ok" onclick="handleTitle('${t._id}','approveTitle')">通过并挂上</button>
                    <button class="btn no" onclick="handleTitle('${t._id}','rejectTitle')">拒绝</button>
                </div>
            </div>`).join('');
    }

    async function handleTitle(id, action) {
        const res = await api(action, { requestId: id });
        if (res.code === 200) reloadTitles(); else alert(res.message);
    }

    function renderUsers(list) {
        const box = document.getElementById('user-list');
        document.getElementById('user-count').textContent = list.length;
        if (!list.length) { box.innerHTML = '<div class="empty">没有待审核的注册申请</div>'; return; }
        box.innerHTML = list.map(u => `
            <div class="item">
                <div class="meta">${esc(u.username)} · 昵称 ${esc(u.nickname)} · ${esc(u.contact || '没留联系方式')} · ${time(u.created_at)}</div>
                <div class="body">${esc(u.reason || '（没写理由）')}</div>
                <div class="row">
                    <button class="btn ok" onclick="handleUser('${u._id}','approveUser')">通过</button>
                    <button class="btn no" onclick="handleUser('${u._id}','rejectUser')">拒绝</button>
                </div>
            </div>`).join('');
    }

    function renderPosts(list) {
        const box = document.getElementById('post-list');
        document.getElementById('post-count').textContent = list.length;
        if (!list.length) { box.innerHTML = '<div class="empty">没有待审核的帖子</div>'; return; }
        box.innerHTML = list.map(p => `
            <div class="item">
                <div class="meta"><span class="tag">${esc(p.category)}</span>${esc(p.author)} · ${esc(p.date)} · 来自 ${esc(p.created_by)}</div>
                <div class="body">${esc(p.content)}</div>
                ${p.images && p.images.length ? `<div class="meta">图片：${p.images.map(i => esc(i)).join('，')}</div>` : ''}
                <div class="meta">姓名：${esc(p.real_name || '未填')} · 班级：${esc(p.class_name || '未填')} · 备注：${esc(p.note || '无')}</div>
                <div class="row">
                    <button class="btn ok" onclick="handlePost('${p._id}','approvePost')">通过</button>
                    <button class="btn no" onclick="handlePost('${p._id}','rejectPost')">拒绝</button>
                </div>
            </div>`).join('');
    }

    async function handleUser(id, action) {
        const res = await api(action, { requestId: id });
        if (res.code === 200) reload(); else alert(res.message);
    }

    async function handlePost(id, action) {
        const res = await api(action, { postId: id });
        if (res.code === 200) reloadPosts(); else alert(res.message);
    }
</script>
</body>
</html>
