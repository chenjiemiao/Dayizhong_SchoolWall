<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>后台 · 达一中校园墙</title>
    <style>
        :root { --bg:#121212; --panel:#1e1e1e; --text:#e0e0e0; --muted:#aaa; --accent:#ff7675; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 18px; }
        .wrap { max-width:760px; margin:0 auto; }
        .back { color:var(--muted); text-decoration:none; font-size:14px; }
        h1 { color:var(--accent); font-size:22px; margin:16px 0 18px; }
        h2 { font-size:16px; margin:0 0 12px; color:var(--accent); }
        .card { background:var(--panel); border:1px solid #2a2a2a; border-radius:12px; padding:18px; margin-bottom:16px; }
        label { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
        input, select, textarea { width:100%; padding:11px; border-radius:8px; border:1px solid #333; background:#161616; color:var(--text); font-size:14px; font-family:inherit; outline:none; }
        textarea { min-height:80px; resize:vertical; }
        .btn { padding:10px 16px; border:none; border-radius:8px; background:var(--accent); color:#121212; font-weight:bold; cursor:pointer; font-size:14px; }
        .btn.ghost { background:transparent; border:1px solid #555; color:var(--text); }
        .btn.ok { background:#55efc4; }
        .btn.no { background:#636e72; color:#fff; }
        .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .item { border:1px solid #2a2a2a; border-radius:10px; padding:14px; margin-bottom:10px; background:#181818; }
        .item .meta { font-size:12px; color:var(--muted); margin-bottom:8px; line-height:1.8; }
        .item .body { font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word; margin-bottom:10px; }
        .empty { color:var(--muted); font-size:13px; padding:6px 0; }
        .msg { margin-top:10px; font-size:13px; display:none; }
        .msg.err { display:block; color:#ff6b6b; }
        .msg.ok { display:block; color:#55efc4; }
        .tag { display:inline-block; padding:1px 8px; border-radius:4px; background:rgba(255,118,117,.15); color:var(--accent); font-size:12px; margin-right:6px; }
        .role { font-size:11px; padding:1px 6px; border-radius:4px; background:rgba(253,203,110,.15); color:#fdcb6e; margin-left:6px; }
    
        /* 全站动态背景 */
        .bg-media { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-media video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .bg-media .bg-mask { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,18,18,0.45) 0%, rgba(18,18,18,0.88) 100%); }
        .wrap, .container, .card, .pf-card, .modal-content { position: relative; z-index: 1; }
    
        .fold-h { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
        .fold-h::after { content: '▾'; margin-left: auto; color: #777; font-size: 12px; }
        .card-body.hidden { display: none; }
        .cnt { color: var(--accent); font-size: 13px; }
            .edit-form { display: flex; flex-direction: column; gap: 6px; }
        .edit-form label { margin: 4px 0 0; font-size: 12px; }
        .edit-form input { padding: 8px 10px; font-size: 13px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #333; }
    </style>
</head>
<body>
<div class="bg-media" aria-hidden="true"><video autoplay muted loop playsinline preload="none"></video><div class="bg-mask"></div></div>
<script>
(function () {
  var v = document.querySelector('.bg-media video');
  var wide = window.matchMedia('(min-width: 1100px)').matches;
  v.src = wide
    ? 'https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bg-1080.mp4'
    : 'https://media-allied-chameleon-d0ehvgsf3098b23.webapps.tcloudbase.com/bg-720.mp4';
  v.play().catch(function () {});
})();

    // ---- 折叠与计数 ----
    const FOLD_DEFAULT = ['sec-users', 'sec-requests', 'sec-posts', 'sec-titles', 'sec-grant', 'sec-notice', 'sec-approved', 'sec-gate', 'sec-broadcast', 'sec-announce'];
    function foldInit() {
        document.querySelectorAll('#panel .card').forEach((card) => {
            const h = card.querySelector('h2');
            if (!h || card.querySelector('.card-body')) return;
            const body = document.createElement('div');
            body.className = 'card-body';
            Array.from(card.childNodes).forEach((n) => { if (n !== h) body.appendChild(n); });
            card.appendChild(body);
            h.classList.add('fold-h');
            h.addEventListener('click', () => body.classList.toggle('hidden'));
            if (FOLD_DEFAULT.indexOf(card.id) !== -1) body.classList.add('hidden');
        });
    }
    function setCount(id, n) {
        const el = document.getElementById(id);
        if (el) el.textContent = n > 0 ? '(' + n + ')' : '';
    }
    foldInit();
</script>

<div class="wrap">
    <a class="back" href="./index.html">← 返回首页</a>
    <h1>🔐 后台</h1>

    <div class="card" id="login-card">
        <label>用户名</label>
        <input id="adm-name" placeholder="你自己的账号">
        <label>密码</label>
        <input id="adm-pass" type="password" placeholder="账号密码">
        <button class="btn" id="adm-btn" onclick="login()" style="margin-top:16px">登录后台</button>
        <div class="msg" id="login-msg"></div>
        <p style="font-size:12px;color:#777;margin-top:12px">必须用管理员账号登录，光知道密码进不来。</p>
    </div>

    <div id="panel" hidden>
        <div class="card" id="sec-users">
            <h2>用户管理 <span class="cnt" id="cnt-users"></span></h2>
            <div id="user-list"><div class="empty">加载中…</div></div>
        </div>

        <div class="card" id="sec-notice">
            <h2>发通知</h2>
            <label>发给谁（用户名）</label>
            <input id="notice-user" placeholder="比如 test_demo_001">
            <label>内容</label>
            <textarea id="notice-text" placeholder="比如：你发的那条帖子涉嫌违规，已被删除"></textarea>
            <div class="row"><button class="btn" onclick="sendNotice()">发送</button></div>
            <div class="msg" id="notice-msg"></div>
        </div>

        <div class="card" id="sec-approved">
            <h2>已上墙的帖子</h2>
            <div id="approved-list"><div class="empty">加载中…</div></div>
        </div>

        <div class="card" id="sec-grant" hidden>
            <h2>头衔发放 <span class="tag">只有站长</span></h2>
            <select id="grant-type" onchange="onGrantType()">
                <option value="🍍StarsPro">🍍StarsPro</option>
                <option value="🍍Stars++">🍍Stars++</option>
                <option value="自定义">自定义称号…</option>
                <option value="🎄初雪之约">🎄初雪之约（雪景动效）</option>
                <option value="🍍StarsMaster">🍍StarsMaster（网站建设）</option>
                <option value="🍍StarsAdmin">🍍StarsAdmin（管理员）</option>
                <option value="🏆名人堂">🏆名人堂</option>
            </select>
            <input id="grant-custom" placeholder="自定义头衔，最多 10 字" maxlength="10" hidden>
            <div id="grant-users"><div class="empty">加载中…</div></div>
        </div>

        <div class="card" id="sec-requests" hidden>
            <h2>待审核账号 <span class="cnt" id="cnt-req"></span></h2>
            <div id="req-list"><div class="empty">加载中…</div></div>
        </div>

        <div class="card" id="sec-posts" hidden>
            <h2>待审核帖子 <span class="cnt" id="cnt-posts"></span></h2>
            <div id="post-list"><div class="empty">加载中…</div></div>
        </div>

        <div class="card" id="sec-titles" hidden>
            <h2>待审核头衔 <span class="cnt" id="cnt-titles"></span></h2>
            <div id="title-list"><div class="empty">加载中…</div></div>
        </div>

        <div class="card" id="sec-gate" hidden>
            <h2>更改暗号 <span class="tag">只有站长</span></h2>
            <input id="gate-input" placeholder="新的暗号，改完要通知大家">
            <div class="row"><button class="btn" onclick="saveGate()">保存暗号</button></div>
            <div class="msg" id="gate-msg"></div>
        </div>

        <div class="card" id="sec-broadcast" hidden>
            <h2>全局通知 <span class="tag">发给所有人</span></h2>
            <textarea id="broadcast-text" placeholder="比如：本周暗号已更新，进墙前请先看最新通知"></textarea>
            <div class="row"><button class="btn" onclick="sendBroadcast()">发给所有人</button></div>
            <div class="msg" id="broadcast-msg"></div>
        </div>

        <div class="card" id="sec-announce" hidden>
            <h2>发公告 <span class="tag">直接上墙，不用审核</span></h2>
            <label>标题</label>
            <input id="ann-title" placeholder="比如：本周暗号已更换">
            <label>正文</label>
            <textarea id="ann-content" placeholder="写清楚要通知什么"></textarea>
            <div class="row"><button class="btn" onclick="publishAnnounce()">发布公告</button></div>
            <div class="msg" id="ann-msg"></div>
        </div>

        <div class="row">
            <button class="btn ghost" onclick="reload()">刷新</button>
            <button class="btn ghost" onclick="logoutAdmin()">退出后台</button>
        </div>
    </div>
</div>

<script>
    var USERS = {};
    const API = 'https://allied-chameleon-d0ehvgsf3098b23-1533927425.ap-shanghai.app.tcloudbase.com/api';
    let me = null;

    function api(action, data) {
        const token = localStorage.getItem('admin_token') || '';
        return fetch(API + '?action=' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ token }, data || {}))
        }).then(r => r.json()).catch(() => ({ code: -1, message: '网络请求失败' }));
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function time(t) {
        return t ? new Date(t).toLocaleString('zh-CN', { hour12: false }) : '';
    }

    async function login() {
        const username = document.getElementById('adm-name').value.trim();
        const password = document.getElementById('adm-pass').value;
        const msg = document.getElementById('login-msg');
        const btn = document.getElementById('adm-btn');
        if (!username || !password) { msg.textContent = '用户名和密码都要填'; msg.className = 'msg err'; return; }
        btn.disabled = true; btn.textContent = '登录中…';
        const res = await fetch(API + '?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        }).then(r => r.json()).catch(() => ({ code: -1, message: '网络请求失败' }));
        btn.disabled = false; btn.textContent = '登录后台';
        if (res.code !== 200) { msg.textContent = res.message || '登录失败'; msg.className = 'msg err'; return; }
        if (res.user.role !== 'owner' && res.user.role !== 'admin') {
            msg.textContent = '这个账号不是管理员';
            msg.className = 'msg err';
            return;
        }
        localStorage.setItem('admin_token', res.token);
        localStorage.setItem('admin_user', JSON.stringify(res.user));
        me = res.user;
        showPanel();
    }

    function showPanel() {
        document.getElementById('login-card').hidden = true;
        document.getElementById('panel').hidden = false;
        const owner = me.role === 'owner';
        document.getElementById('sec-grant').hidden = !owner;
        document.getElementById('sec-requests').hidden = !owner;
        document.getElementById('sec-posts').hidden = !owner;
        document.getElementById('sec-titles').hidden = !owner;
        document.getElementById('sec-gate').hidden = !owner;
        document.getElementById('sec-broadcast').hidden = !owner;
        document.getElementById('sec-announce').hidden = !owner;
        reload();
    }

    async function reload() {
        loadUsers();
        loadApproved();
        if (me.role === 'owner') {
            loadRequests();
            loadPendingPosts();
            loadTitles();
        }
    }

    async function loadUsers() {
        const box = document.getElementById('user-list');
        const res = await api('adminListUsers');
        if (res.code !== 200) { box.innerHTML = '<div class="empty">' + esc(res.message || '加载失败') + '</div>'; return; }
        setCount('cnt-users', res.data.length);
        const owner = me.role === 'owner';
        USERS = {};
        res.data.forEach(function (u) { USERS[u.username] = u; });
        box.innerHTML = res.data.map(function (u) {
            var banned = u.status === "banned";
            var roleTag = u.role === 'owner' ? '<span class="role">站长</span>' : (u.role === 'admin' ? '<span class="role">管理员</span>' : '');
            var titles = (u.titles || []).length ? u.titles.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') : '无头衔';
            var extra = '';
            if (u.role !== 'owner') {
                extra += '<button class="btn ghost" onclick="setRole(\'' + esc(u.username) + '\',\'' + (u.role === 'admin' ? 'user' : 'admin') + '\')">' + (u.role === 'admin' ? '取消管理员' : '设为管理员') + '</button>';
                extra += '<button class="btn no" onclick="toggleBan(\'' + esc(u.username) + '\',' + (banned ? 'false' : 'true') + ')">' + (banned ? '解封' : '封号') + '</button>';
            }
            return '<div class="item">' +
                '<div class="meta">' + esc(u.nickname) + '（' + esc(u.username) + '）' + (u.real_name ? ' · 真名 ' + esc(u.real_name) : ' · 真名 未填') + (u.class_name ? ' · ' + esc(u.class_name) : '') + roleTag + (banned ? ' · <span style="color:#ff6b6b">已封禁</span>' : '') + '</div>' +
                '<div class="meta">' + titles + '</div>' +
                '<div class="row"><button class="btn ghost" onclick="toggleActions(\'' + esc(u.username) + '\')">⚙ 管理</button></div>' +
                '<div class="actions" id="act-' + esc(u.username) + '" hidden>' +
                    '<button class="btn" onclick="grantTo(\'' + esc(u.username) + '\')">授予头衔</button>' +
                    '<button class="btn ghost" onclick="editUser(\'' + esc(u.username) + '\')">改资料</button>' +
                    extra +
                '</div>' +
            '</div>';
        }).join('');
    }

    function toggleActions(username) {
        var el = document.getElementById('act-' + username);
        if (el) el.hidden = !el.hidden;
    }

    function editUser(username) {
        var u = USERS[username] || {};
        var box = document.getElementById('act-' + username);
        if (!box) return;
        box.hidden = false;
        box.innerHTML =
            '<div class="edit-form">' +
            '<label>昵称</label><input id="e-nick-' + username + '" value="' + esc(u.nickname || '') + '">' +
            '<label>真实姓名</label><input id="e-real-' + username + '" value="' + esc(u.real_name || '') + '">' +
            '<label>班级</label><input id="e-class-' + username + '" value="' + esc(u.class_name || '') + '">' +
            '<div class="row"><button class="btn" onclick="saveEdit(\'' + username + '\')">保存</button>' +
            '<button class="btn ghost" onclick="toggleActions(\'' + username + '\')">取消</button></div>' +
            '</div>';
    }

    async function saveEdit(username) {
        var nickname = document.getElementById('e-nick-' + username).value.trim();
        var realName = document.getElementById('e-real-' + username).value.trim();
        var className = document.getElementById('e-class-' + username).value.trim();
        var res = await api('adminEditUser', { username: username, nickname: nickname, realName: realName, className: className });
        if (res.code === 200) loadUsers(); else alert(res.message || '保存失败');
    }

    async function loadApproved() {
        const box = document.getElementById('approved-list');
        const res = await api('posts');
        if (res.code !== 200) { box.innerHTML = '<div class="empty">加载失败</div>'; return; }
        const list = res.data || [];
        if (!list.length) { box.innerHTML = '<div class="empty">墙上还没有帖子</div>'; return; }
        box.innerHTML = list.map(p => `
            <div class="item">
                <div class="meta"><span class="tag">${esc(p.category)}</span>${esc(p.author)} · ${esc(p.date)}</div>
                <div class="body"><b>${esc(p.title || '（无标题）')}</b><br>${esc((p.content || '').slice(0, 120))}</div>
                <div class="row"><button class="btn no" onclick="delPost('${p._id}')">删除违规帖</button></div>
            </div>`).join('');
    }

    async function loadRequests() {
        const box = document.getElementById('req-list');
        const res = await api('adminRequests');
        if (res.code !== 200) { box.innerHTML = '<div class="empty">' + esc(res.message || '') + '</div>'; return; }
        setCount('cnt-req', res.data.length);
        if (!res.data.length) { box.innerHTML = '<div class="empty">没有待审核的注册申请</div>'; return; }
        box.innerHTML = res.data.map(u => `
            <div class="item">
                <div class="meta">${esc(u.username)} · 昵称 ${esc(u.nickname)} · ${esc(u.contact || '没留联系方式')}</div>
                <div class="row">
                    <button class="btn ok" onclick="handleUser('${u._id}','approveUser')">通过</button>
                    <button class="btn no" onclick="handleUser('${u._id}','rejectUser')">拒绝</button>
                </div>
            </div>`).join('');
    }

    async function loadPendingPosts() {
        const box = document.getElementById('post-list');
        const res = await api('adminPosts');
        if (res.code !== 200) { box.innerHTML = '<div class="empty">' + esc(res.message || '') + '</div>'; return; }
        setCount('cnt-posts', res.data.length);
        if (!res.data.length) { box.innerHTML = '<div class="empty">没有待审核的帖子</div>'; return; }
        box.innerHTML = res.data.map(p => `
            <div class="item">
                <div class="meta"><span class="tag">${esc(p.category)}</span>${esc(p.author)} · ${esc(p.date)} · 来自 ${esc(p.created_by)}</div>
                <div class="body"><b>${esc(p.title || '（无标题）')}</b><br>${esc(p.content)}</div>
                <div class="row">
                    <button class="btn ok" onclick="handlePost('${p._id}','approvePost')">通过</button>
                    <button class="btn no" onclick="handlePost('${p._id}','rejectPost')">拒绝</button>
                </div>
            </div>`).join('');
    }

    async function loadTitles() {
        const box = document.getElementById('title-list');
        const res = await api('adminTitles');
        if (res.code !== 200) { box.innerHTML = '<div class="empty">' + esc(res.message || '') + '</div>'; return; }
        setCount('cnt-titles', res.data.length);
        if (!res.data.length) { box.innerHTML = '<div class="empty">没有待审核的头衔申请</div>'; return; }
        box.innerHTML = res.data.map(t => `
            <div class="item">
                <div class="meta">${esc(t.nickname)}（${esc(t.username)}）申请 <b>${esc(t.title)}</b> · ${esc(t.amount || '未填')} · ${time(t.created_at)}</div>
                ${t.proof && t.proof.indexOf('data:image') === 0 ? `<img src="${t.proof}" style="max-width:180px;border-radius:8px;margin:6px 0;border:1px solid #333">` : ''}
                <div class="row">
                    <button class="btn ok" onclick="handleTitle('${t._id}','approveTitle')">通过</button>
                    <button class="btn no" onclick="handleTitle('${t._id}','rejectTitle')">拒绝</button>
                </div>
            </div>`).join('');
    }

    async function grantTo(username) {
        const type = document.getElementById('grant-type').value;
        const custom = document.getElementById('grant-custom').value.trim();
        const title = type === '自定义' ? custom : type;
        if (!title) return alert('先选好头衔');
        const res = await api('adminGrantTitle', { username, title });
        if (res.code === 200) loadUsers(); else alert(res.message || '失败');
    }

    function onGrantType() {
        document.getElementById('grant-custom').hidden = document.getElementById('grant-type').value !== '自定义';
    }

    async function setRole(username, role) {
        const res = await api('adminSetRole', { username, role });
        if (res.code === 200) loadUsers(); else alert(res.message || '失败');
    }

    async function toggleBan(username, banned) {
        if (banned && !confirm('封禁后他登录不了，确定？')) return;
        const res = await api('banUser', { username, banned });
        if (res.code === 200) loadUsers(); else alert(res.message || '失败');
    }

    async function handleUser(id, action) {
        const res = await api(action, { requestId: id });
        if (res.code === 200) loadRequests(); else alert(res.message);
    }

    async function handlePost(id, action) {
        const res = await api(action, { postId: id });
        if (res.code === 200) loadPendingPosts(); else alert(res.message);
    }

    async function handleTitle(id, action) {
        const res = await api(action, { requestId: id });
        if (res.code === 200) loadTitles(); else alert(res.message);
    }

    async function delPost(id) {
        if (!confirm('删了就找不回来了，确定？')) return;
        const res = await api('deletePost', { postId: id });
        if (res.code === 200) loadApproved(); else alert(res.message || '失败');
    }

    async function saveGate() {
        const gate = document.getElementById('gate-input').value.trim();
        const msg = document.getElementById('gate-msg');
        if (!gate) { msg.textContent = '暗号不能空'; msg.className = 'msg err'; return; }
        const res = await api('setGate', { gate });
        msg.textContent = res.message || '完成';
        msg.className = 'msg ' + (res.code === 200 ? 'ok' : 'err');
        if (res.code === 200) document.getElementById('gate-input').value = '';
    }

    async function publishAnnounce() {
        const title = document.getElementById('ann-title').value.trim();
        const content = document.getElementById('ann-content').value.trim();
        const msg = document.getElementById('ann-msg');
        if (!title || !content) { msg.textContent = '标题和正文都要填'; msg.className = 'msg err'; return; }
        const res = await api('adminCreatePost', { title, content, category: '通知' });
        msg.textContent = res.message || '完成';
        msg.className = 'msg ' + (res.code === 200 ? 'ok' : 'err');
        if (res.code === 200) {
            document.getElementById('ann-title').value = '';
            document.getElementById('ann-content').value = '';
            loadApproved();
        }
    }

    async function sendBroadcast() {
        const text = document.getElementById('broadcast-text').value.trim();
        const msg = document.getElementById('broadcast-msg');
        if (!text) { msg.textContent = '内容不能空'; msg.className = 'msg err'; return; }
        const res = await api('adminBroadcastNotice', { text });
        msg.textContent = res.message || '完成';
        msg.className = 'msg ' + (res.code === 200 ? 'ok' : 'err');
        if (res.code === 200) document.getElementById('broadcast-text').value = '';
    }

    async function sendNotice() {
        const username = document.getElementById('notice-user').value.trim();
        const text = document.getElementById('notice-text').value.trim();
        const msg = document.getElementById('notice-msg');
        if (!username || !text) { msg.textContent = '用户和内容都要填'; msg.className = 'msg err'; return; }
        const res = await api('adminSendNotice', { username, text });
        msg.textContent = res.message || '完成';
        msg.className = 'msg ' + (res.code === 200 ? 'ok' : 'err');
        if (res.code === 200) document.getElementById('notice-text').value = '';
    }

    function logoutAdmin() {
        localStorage.removeItem('admin_token');
        localStorage.removeItem('admin_user');
        location.reload();
    }

    (async function init() {
        const token = localStorage.getItem('admin_token');
        const raw = localStorage.getItem('admin_user');
        if (!token || !raw) return;
        try { me = JSON.parse(raw); } catch (e) { return; }
        const res = await api('me');
        if (res.code !== 200) { logoutAdmin(); return; }
        me = res.user;
        if (me.role !== 'owner' && me.role !== 'admin') { logoutAdmin(); return; }
        showPanel();
    })();
</script>
</body>
</html>
